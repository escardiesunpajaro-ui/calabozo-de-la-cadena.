// ==================================================
// REDIMENSIONAR INTERFAZ
// ==================================================

function redimensionarInterfaz() {

    if (!escenaJuego) {
        return;
    }

    let ancho =
        escenaJuego.scale.width;

    let alto =
        escenaJuego.scale.height;


    // ==================================================
    // HUD
    // ==================================================

    if (textoRonda) {

        textoRonda.x =
            ancho - 20;
    }


    // ==================================================
    // PANEL MATEMÁTICO
    // ==================================================

    if (contenedorMatematicas) {

        let panelAncho =
            Math.min(
                760,
                ancho - 30
            );

        let panelAlto = 300;

        let x =
            ancho / 2;

        let y =
            Math.min(
                alto - 155,
                alto / 2 + 120
            );

        y =
            Math.max(
                170,
                y
            );

        contenedorMatematicas.setPosition(
            x,
            y
        );

        fondoMat.setSize(
            panelAncho,
            panelAlto
        );

        let margen =
            -panelAncho / 2 + 20;

        textoTituloMat.x =
            margen;

        textoFuncionMat.x =
            margen;

        textoPreguntaMat.x =
            margen;

        textoRespuesta1.x =
            margen + 25;

        textoRespuesta2.x =
            margen + 25;

        textoRespuesta3.x =
            margen + 25;

        textoAyudaMat.x =
            margen;

        textoPreguntaMat.setWordWrapWidth(
            panelAncho - 40
        );
    }
}


// ==================================================
// UPDATE
// ==================================================

function update() {

    if (!partidaIniciada) {
        return;
    }

    if (jugadorMuerto) {

        jugador.body.setVelocity(0);

        return;
    }


    if (juegoCongelado) {

        manejarRecarga();

        jugador.body.setVelocity(0);

        enemigos.getChildren().forEach(
            enemigo => {

                enemigo.body.setVelocity(0);
            }
        );

        proyectilesEnemigos.getChildren().forEach(
            proyectil => {

                proyectil.body.setVelocity(0);
            }
        );

        return;
    }


    // ==================================================
    // CAMBIO DE ARMAS
    // ==================================================

    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.UNO
        )
    ) {

        cambiarArma(
            ARMAS.PISTOLA
        );
    }

    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.DOS
        )
    ) {

        cambiarArma(
            ARMAS.RIFLE
        );
    }

    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.TRES
        )
    ) {

        cambiarArma(
            ARMAS.ESCOPETA
        );
    }


    // ==================================================
    // MOVIMIENTO
    // ==================================================

    jugador.body.setVelocity(0);

    let velocidad = 300;

    if (teclado.IZQUIERDA.isDown) {

        jugador.body.setVelocityX(
            -velocidad
        );

    } else if (teclado.DERECHA.isDown) {

        jugador.body.setVelocityX(
            velocidad
        );
    }

    if (teclado.ARRIBA.isDown) {

        jugador.body.setVelocityY(
            -velocidad
        );

    } else if (teclado.ABAJO.isDown) {

        jugador.body.setVelocityY(
            velocidad
        );
    }


    // ==================================================
    // ENEMIGOS
    // ==================================================

    enemigos.getChildren().forEach(
        enemigo => {

            if (
                enemigo.tipo === 'Glifo'
            ) {

                this.physics.moveToObject(
                    enemigo,
                    jugador,
                    160
                );

            } else if (
                enemigo.tipo === 'Golem'
            ) {

                this.physics.moveToObject(
                    enemigo,
                    jugador,
                    50
                );

            } else if (
                enemigo.tipo === 'Vortice'
            ) {

                let distancia =
                    Phaser.Math.Distance.Between(
                        enemigo.x,
                        enemigo.y,
                        jugador.x,
                        jugador.y
                    );

                if (distancia > 350) {

                    this.physics.moveToObject(
                        enemigo,
                        jugador,
                        80
                    );

                } else {

                    enemigo.body.setVelocity(0);
                }


                if (
                    !enemigo.ultimoDisparo ||
                    this.time.now -
                    enemigo.ultimoDisparo >=
                    2000
                ) {

                    dispararProyectilVortice(
                        this,
                        enemigo
                    );

                    enemigo.ultimoDisparo =
                        this.time.now;
                }
            }
        }
    );
}

// ==================================================
// CREAR BOTÓN
// ==================================================

function crearBoton(
    escena,
    x,
    y,
    texto,
    accion
) {

    let boton =
        escena.add.container(
            x,
            y
        )
        .setScrollFactor(0)
        .setDepth(101);


    let fondoBoton =
        escena.add.rectangle(
            0,
            0,
            300,
            60,
            0x252538,
            1
        )
        .setOrigin(0.5);


    let textoBoton =
        escena.add.text(
            0,
            0,
            texto,
            {
                fontSize: '25px',
                fill: '#ffffff',
                fontStyle: 'bold'
            }
        )
        .setOrigin(0.5);


    boton.add([
        fondoBoton,
        textoBoton
    ]);


    boton.setSize(
        300,
        60
    );


    boton.setInteractive(
        new Phaser.Geom.Rectangle(
            -150,
            -30,
            300,
            60
        ),
        Phaser.Geom.Rectangle.Contains
    );


    boton.input.cursor =
        'pointer';


    boton.on(
        'pointerover',
        () => {

            fondoBoton.setFillStyle(
                0x383850
            );

            textoBoton.setStyle({
                fill: '#ffff00'
            });
        }
    );


    boton.on(
        'pointerout',
        () => {

            fondoBoton.setFillStyle(
                0x252538
            );

            textoBoton.setStyle({
                fill: '#ffffff'
            });
        }
    );


    boton.on(
        'pointerdown',
        (
            pointer,
            localX,
            localY,
            event
        ) => {

            if (event) {
                event.stopPropagation();
            }

            accion();
        }
    );


    return boton;
}

        escenaJuego.add.container(
            400,
            300
        )
        .setScrollFactor(0)
        .setDepth(110);


    let fondo =
        escenaJuego.add.rectangle(
            0,
            0,
            800,
            600,
            0x080810,
            0.98
        );


    let titulo =
        escenaJuego.add.text(
            0,
            -180,
            'CRÉDITOS',
            {
                fontSize: '40px',
                fill: '#ffffff',
                fontStyle: 'bold'
            }
        )
        .setOrigin(0.5);


    let texto =
        escenaJuego.add.text(
            0,
            -60,

            'CALABOZO DE LA CADENA\n\n' +

            'Juego de supervivencia por oleadas.\n\n' +

            'Combate + Matemáticas + Supervivencia\n\n' +

            'Proyecto académico',

            {
                fontSize: '20px',
                fill: '#ffffff',
                align: 'center',
                lineSpacing: 10
            }
        )
        .setOrigin(0.5);


    let volver =
        crearBoton(
            escenaJuego,
            0,
            170,
            '← VOLVER',
            () => {

                menuCreditos.destroy();

                menuCreditos = null;

                menuPrincipal.setVisible(true);

                redimensionarInterfaz();
            }
        );


    menuCreditos.add([
        fondo,
        titulo,
        texto,
        volver
    ]);
}


// ==================================================
// RONDAS
// ==================================================

function iniciarRonda(escena) {

    generandoNuevaRonda = true;

    let cantidadGlifos = 0;
    let cantidadVortices = 0;
    let cantidadGolems = 0;


    if (rondaActual === 1) {

        cantidadGlifos = 5;

    } else if (rondaActual === 2) {

        cantidadVortices = 4;

    } else if (rondaActual === 3) {

        cantidadGlifos = 6;
        cantidadVortices = 4;

    } else if (rondaActual === 4) {

        cantidadGolems = 3;

    } else {

        let aumento =
            rondaActual - 5;

        cantidadGlifos =
            6 + aumento * 2;

        cantidadVortices =
            4 + aumento;

        cantidadGolems =
            2 +
            Math.floor(
                aumento / 2
            );
    }


    for (
        let i = 0;
        i < cantidadGlifos;
        i++
    ) {

        crearEnemigo(
            escena,
            'Glifo',
            0x00ffff,
            20
        );
    }


    for (
        let i = 0;
        i < cantidadVortices;
        i++
    ) {

        crearEnemigo(
            escena,
            'Vortice',
            0xff00ff,
            20
        );
    }


    for (
        let i = 0;
        i < cantidadGolems;
        i++
    ) {

        crearEnemigo(
            escena,
            'Golem',
            0xff5500,
            150
        );
    }


    generandoNuevaRonda = false;

    mostrarRonda();

    actualizarUI();
}


// ==================================================
// MOSTRAR RONDA
// ==================================================

function mostrarRonda() {

    if (!textoRonda) {
        return;
    }

    textoRonda.setText(
        `RONDA ${rondaActual}`
    );

    textoRonda.setAlpha(1);

    escenaJuego.tweens.add({

        targets: textoRonda,

        alpha: 0.35,

        duration: 700,

        yoyo: true,

        repeat: 2
    });
}


// ==================================================
// FIN DE RONDA
// ==================================================

function comprobarFinRonda() {

    if (
        jugadorMuerto ||
        generandoNuevaRonda
    ) {
        return;
    }


    let enemigosVivos =
        enemigos.countActive(true);


    if (
        enemigosVivos <= 0
    ) {

        generandoNuevaRonda = true;

        escenaJuego.time.delayedCall(
            1000,
            () => {

                if (jugadorMuerto) {
                    return;
                }

                rondaActual++;

                iniciarRonda(
                    escenaJuego
                );
            }
        );
    }
}


// ==================================================
// CREAR ENEMIGO
// ==================================================

function crearEnemigo(
    escena,
    tipo,
    color,
    hp
) {

    let x;
    let y;
    let distanciaJugador;


    do {

        x =
            Phaser.Math.Between(
                100,
                2300
            );

        y =
            Phaser.Math.Between(
                100,
                2300
            );

        distanciaJugador =
            Phaser.Math.Distance.Between(
                x,
                y,
                jugador.x,
                jugador.y
            );

    } while (
        distanciaJugador < 400
    );


    let tamaño =
        tipo === 'Golem'
            ? 48
            : 24;


    let enemigo =
        escena.add.rectangle(
            x,
            y,
            tamaño,
            tamaño,
            color
        );


    escena.physics.add.existing(
        enemigo
    );


    enemigo.tipo =
        tipo;

    enemigo.hp =
        hp;

    enemigo.ultimoDisparo =
        0;


    enemigos.add(
        enemigo
    );
}


// ==================================================
// DISPARAR
// ==================================================

function disparar(escena) {

    if (
        juegoCongelado ||
        jugadorMuerto ||
        !partidaIniciada
    ) {
        return;
    }


    if (
        balasActuales <= 0
    ) {

        iniciarRecarga();

        return;
    }


    balasActuales--;

    actualizarUI();


    let bala =
        escena.add.circle(
            jugador.x,
            jugador.y,
            6,
            0xffff00
        );


    escena.physics.add.existing(
        bala
    );


    balas.add(
        bala
    );


    // ==================================================
    // DIRECCIÓN DEL PROYECTIL
    // ==================================================

    const puntoMundo =
        escena.cameras.main.getWorldPoint(
            mouse.x,
            mouse.y
        );


    const angulo =
        Phaser.Math.Angle.Between(
            jugador.x,
            jugador.y,
            puntoMundo.x,
            puntoMundo.y
        );


    escena.physics.velocityFromRotation(
        angulo,
        armaActual.velocidadBala,
        bala.body.velocity
    );
}


// ==================================================
// PROYECTIL DEL VÓRTICE
// ==================================================

function dispararProyectilVortice(
    escena,
    vortice
) {

    if (
        juegoCongelado ||
        jugadorMuerto
    ) {
        return;
    }


    let proyectil =
        escena.add.circle(
            vortice.x,
            vortice.y,
            7,
            0xff00ff
        );


    escena.physics.add.existing(
        proyectil
    );


    proyectilesEnemigos.add(
        proyectil
    );


    let angulo =
        Phaser.Math.Angle.Between(
            vortice.x,
            vortice.y,
            jugador.x,
            jugador.y
        );


    escena.physics.velocityFromRotation(
        angulo,
        220,
        proyectil.body.velocity
    );


    proyectil.daño = 10;


    escena.time.delayedCall(
        5000,
        () => {

            if (
                proyectil &&
                proyectil.active
            ) {

                proyectil.destroy();
            }
        }
    );
}


// ==================================================
// CONTACTO ENEMIGO
// ==================================================

function contactoEnemigo(
    jugadorObj,
    enemigo
) {

    if (
        jugadorMuerto ||
        invulnerable
    ) {
        return;
    }


    if (
        enemigo.tipo === 'Vortice'
    ) {
        return;
    }


    if (
        enemigo.tipo === 'Glifo'
    ) {

        recibirDaño(10);
    }


    if (
        enemigo.tipo === 'Golem'
    ) {

        recibirDaño(20);
    }
}


// ==================================================
// IMPACTO PROYECTIL
// ==================================================

function impactoProyectilEnemigo(
    jugadorObj,
    proyectil
) {

    if (jugadorMuerto) {
        return;
    }


    proyectil.destroy();


    if (invulnerable) {
        return;
    }


    recibirDaño(10);
}


// ==================================================
// RECIBIR DAÑO
// ==================================================

function recibirDaño(
    cantidad
) {

    if (
        jugadorMuerto ||
        invulnerable
    ) {
        return;
    }


    vidaJugador -= cantidad;


    if (
        vidaJugador < 0
    ) {

        vidaJugador = 0;
    }


    actualizarUI();


    invulnerable = true;

    jugador.setAlpha(0.4);


    escenaJuego.time.delayedCall(
        tiempoInvulnerabilidad,
        () => {

            if (!jugadorMuerto) {

                invulnerable = false;

                jugador.setAlpha(1);
            }
        }
    );


    if (
        vidaJugador <= 0
    ) {

        morirJugador();
    }
}


// ==================================================
// MUERTE
// ==================================================

function morirJugador() {

    jugadorMuerto = true;

    jugador.body.setVelocity(0);


    enemigos.getChildren().forEach(
        enemigo => {

            enemigo.body.setVelocity(0);
        }
    );


    proyectilesEnemigos.getChildren().forEach(
        proyectil => {

            proyectil.body.setVelocity(0);
        }
    );


    let fondoMuerte =
        escenaJuego.add.rectangle(
            escenaJuego.scale.width / 2,
            escenaJuego.scale.height / 2,
            escenaJuego.scale.width,
            escenaJuego.scale.height,
            0x000000,
            0.75
        )
        .setScrollFactor(0)
        .setDepth(90);


    escenaJuego.add.text(
        escenaJuego.scale.width / 2,
        escenaJuego.scale.height / 2 - 50,
        'HAS MUERTO',
        {
            fontSize: '48px',
            fill: '#ff0000',
            fontStyle: 'bold'
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0)
    .setDepth(91);


    escenaJuego.add.text(
        escenaJuego.scale.width / 2,
        escenaJuego.scale.height / 2 + 20,
        `Llegaste a la ronda ${rondaActual}`,
        {
            fontSize: '20px',
            fill: '#ffffff'
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0)
    .setDepth(91);


    escenaJuego.add.text(
        escenaJuego.scale.width / 2,
        escenaJuego.scale.height / 2 + 60,
        'Recarga la página para volver a jugar',
        {
            fontSize: '18px',
            fill: '#ffffff'
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0)
    .setDepth(91);
}


// ==================================================
// IMPACTO ENEMIGO
// ==================================================

function impactarEnemigo(
    bala,
    enemigo
) {

    bala.destroy();

    let daño = 0;


    if (
        enemigo.tipo === 'Glifo'
    ) {

        daño =
            armaActual.dañoGlifo;
    }


    if (
        enemigo.tipo === 'Vortice'
    ) {

        daño =
            armaActual.dañoVortice;
    }


    if (
        enemigo.tipo === 'Golem'
    ) {

        daño =
            armaActual.dañoGolem;
    }


    enemigo.hp -= daño;


    if (
        enemigo.hp <= 0
    ) {

        enemigo.destroy();

        comprobarFinRonda();
    }
}


// ==================================================
// CAMBIAR ARMA
// ==================================================

function cambiarArma(
    nuevaArma
) {

    armaActual =
        nuevaArma;

    balasActuales =
        armaActual.balasMax;

    actualizarUI();
}


// ==================================================
// ACTUALIZAR UI
// ==================================================

function actualizarUI() {

    if (!textoUI) {
        return;
    }


    let minutos =
        Math.floor(
            tiempoLimite / 60
        );


    let segundos =
        tiempoLimite % 60;


    segundos =
        segundos < 10
            ? '0' + segundos
            : segundos;


    let enemigosRestantes =
        enemigos
            ? enemigos.countActive(true)
            : 0;


    textoUI.setText(

        `❤️ VIDA: ${vidaJugador} / ${vidaMaxima}\n` +

        `⏱️ TIEMPO RESTANTE: ${minutos}:${segundos}\n` +

        `💥 ARMA EQUIPADA: ${armaActual.nombre.toUpperCase()} (Dificultad: ${armaActual.dif})\n` +

        `⚡ MUNICIÓN: ${balasActuales} / ${armaActual.balasMax}\n` +

        `👾 ENEMIGOS RESTANTES: ${enemigosRestantes}\n\n` +

        `[Movimiento]: W A S D\n` +

        `[Disparo]: Click izquierdo\n` +

        `[Armas]: 1 Pistola | 2 Rifle | 3 Escopeta`
    );


    if (textoRonda) {

        textoRonda.setText(
            `RONDA ${rondaActual}`
        );
    }
}


// ==================================================
// INICIAR RECARGA
// ==================================================

function iniciarRecarga() {

    juegoCongelado = true;

    pasoActual = 1;


    let lista =
        BANCO_PREGUNTAS[
            armaActual.dif
        ];


    preguntaActual =
        lista[
            Phaser.Math.Between(
                0,
                lista.length - 1
            )
        ];


    contenedorMatematicas.setVisible(
        true
    );


    mostrarPaso();
}


// ==================================================
// MOSTRAR PASO
// ==================================================

function mostrarPaso() {

    if (!preguntaActual) {
        return;
    }


    let paso =
        pasoActual === 1
            ? preguntaActual.p1
            : preguntaActual.p2;


    // ==================================================
    // CADA ELEMENTO SE COLOCA POR SEPARADO
    // ==================================================

    textoTituloMat.setText(
        '⚠️ MÓDULO DE DERIVACIÓN REQUERIDO'
    );


    textoFuncionMat.setText(
        `Función actual: ${preguntaActual.f}`
    );


    textoPreguntaMat.setText(
        `PASO ${pasoActual}: ${paso.q}`
    );


    textoRespuesta1.setText(
        paso.opciones[0]
    );


    textoRespuesta2.setText(
        paso.opciones[1]
    );


    textoRespuesta3.setText(
        paso.opciones[2]
    );


    textoAyudaMat.setText(
        'Z = primera opción     X = segunda opción     C = tercera opción'
    );


    // Restaurar posición/estilo de respuestas
    textoRespuesta1.setFill('#ffffff');
    textoRespuesta2.setFill('#ffffff');
    textoRespuesta3.setFill('#ffffff');


    fondoMat.setStrokeStyle(
        3,
        0xffaa00
    );


    redimensionarInterfaz();
}


// ==================================================
// MANEJAR RECARGA
// ==================================================

function manejarRecarga() {

    if (!preguntaActual) {
        return;
    }


    let paso =
        pasoActual === 1
            ? preguntaActual.p1
            : preguntaActual.p2;


    let seleccion = -1;


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.Z
        )
    ) {

        seleccion = 0;
    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.X
        )
    ) {

        seleccion = 1;
    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.C
        )
    ) {

        seleccion = 2;
    }


    if (
        seleccion !== -1
    ) {

        if (
            seleccion === paso.correcta
        ) {

            if (
                pasoActual === 1
            ) {

                pasoActual = 2;

                mostrarPaso();

            } else {

                balasActuales =
                    armaActual.balasMax;

                juegoCongelado =
                    false;

                contenedorMatematicas.setVisible(
                    false
                );

                preguntaActual =
                    null;

                actualizarUI();
            }


        } else {

            fondoMat.setStrokeStyle(
                3,
                0xff0000
            );


            escenaJuego.time.delayedCall(
                300,
                () => {

                    fondoMat.setStrokeStyle(
                        3,
                        0xffaa00
                    );
                }
            );
        }
    }
}

</script>
