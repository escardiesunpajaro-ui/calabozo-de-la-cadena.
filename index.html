<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calabozo de la Cadena</title>

<style>
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
    }

    body {
        background: #1a1a24;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    #canvas-container {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

</head>

<body>
<div id="canvas-container"></div>

<script>

const ANCHO_BASE = 800;
const ALTO_BASE = 600;

const ANCHO_MUNDO = 2400;
const ALTO_MUNDO = 2400;

let jugador;
let enemigos;
let proyectiles;
let proyectilesEnemigos;

let teclado;

let partidaIniciada = false;
let juegoCongelado = false;
let jugadorMuerto = false;
let invulnerable = false;

let vidaJugador = 100;
let vidaMaxima = 100;

let tiempoLimite = 900;
let tiempoRestante = tiempoLimite;

let rondaActual = 1;
let generandoNuevaRonda = false;

let armaActual = "PISTOLA";
let municion = 6;

let textoVida;
let textoTiempo;
let textoArma;
let textoMunicion;
let textoEnemigos;
let textoRonda;

let menuPrincipal;
let overlayActual = null;

let contadorTiempo;

let escenaPrincipal;

const ARMAS = {

    PISTOLA: {
        maxMunicion: 6,
        danoGlifo: 20,
        danoVortice: 20,
        danoGolem: 10,
        velocidad: 450,
        dificultad: "Fácil"
    },

    RIFLE: {
        maxMunicion: 15,
        danoGlifo: 10,
        danoVortice: 10,
        danoGolem: 10,
        velocidad: 650,
        dificultad: "Medio"
    },

    ESCOPETA: {
        maxMunicion: 2,
        danoGlifo: 76,
        danoVortice: 76,
        danoGolem: 76,
        velocidad: 350,
        dificultad: "Difícil"
    }
};

const BANCO_PREGUNTAS = {

    Fácil: [
        {
            pregunta: "y = (3x - 1)⁵\n¿Cuál es la derivada?",
            opciones: [
                "5(3x - 1)⁴",
                "5(3x - 1)⁵",
                "(3x - 1)⁴"
            ],
            correcta: 0
        },
        {
            pregunta: "En y = (3x - 1)⁵,\n¿cuál es la derivada interna?",
            opciones: [
                "3x",
                "3",
                "1"
            ],
            correcta: 1
        }
    ],

    Medio: [
        {
            pregunta: "y = cos(x³)\n¿Cuál es la derivada externa?",
            opciones: [
                "sin(x³)",
                "-sin(x³)",
                "-cos(x³)"
            ],
            correcta: 1
        },
        {
            pregunta: "y = cos(x³)\n¿Cuál es la derivada interna?",
            opciones: [
                "3x²",
                "3x",
                "x²"
            ],
            correcta: 0
        }
    ],

    Difícil: [
        {
            pregunta: "y = ln(sin(x))\n¿Cuál es la derivada externa?",
            opciones: [
                "1/x",
                "1/sin(x)",
                "cos(x)"
            ],
            correcta: 1
        },
        {
            pregunta: "y = ln(sin(x))\n¿Cuál es la derivada interna?",
            opciones: [
                "cos(x)",
                "-cos(x)",
                "1/cos(x)"
            ],
            correcta: 0
        }
    ]
};


const config = {

    type: Phaser.AUTO,

    parent: "canvas-container",

    backgroundColor: "#1a1a24",

    scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },

    physics: {
        default: "arcade",

        arcade: {
            gravity: {
                y: 0
            },
            debug: false
        }
    },

    scene: {
        create: crear,
        update: actualizar
    }
};


const juego = new Phaser.Game(config);


/* =========================================================
   CREAR JUEGO
========================================================= */

function crear() {

    escenaPrincipal = this;

    this.physics.world.setBounds(
        0,
        0,
        ANCHO_MUNDO,
        ALTO_MUNDO
    );


    /* =========================
       CUADRÍCULA DEL MAPA
    ========================= */

    const graphics = this.add.graphics();

    graphics.lineStyle(
        1,
        0x292936,
        1
    );

    for (
        let x = 0;
        x <= ANCHO_MUNDO;
        x += 80
    ) {

        graphics.lineBetween(
            x,
            0,
            x,
            ALTO_MUNDO
        );
    }

    for (
        let y = 0;
        y <= ALTO_MUNDO;
        y += 80
    ) {

        graphics.lineBetween(
            0,
            y,
            ANCHO_MUNDO,
            y
        );
    }


    /* =========================
       JUGADOR
    ========================= */

    jugador = this.add.rectangle(
        1200,
        1200,
        32,
        32,
        0x00ff66
    );

    this.physics.add.existing(jugador);

    jugador.body.setCollideWorldBounds(true);


    /* =========================
       GRUPOS
    ========================= */

    enemigos = this.physics.add.group();

    proyectiles = this.physics.add.group();

    proyectilesEnemigos =
        this.physics.add.group();


    /* =========================
       CÁMARA
    ========================= */

    this.cameras.main.setBounds(
        0,
        0,
        ANCHO_MUNDO,
        ALTO_MUNDO
    );

    this.cameras.main.startFollow(
        jugador,
        true
    );


    /* =========================
       TECLADO
    ========================= */

    teclado = this.input.keyboard.addKeys({

        ARRIBA:
            Phaser.Input.Keyboard.KeyCodes.W,

        ABAJO:
            Phaser.Input.Keyboard.KeyCodes.S,

        IZQUIERDA:
            Phaser.Input.Keyboard.KeyCodes.A,

        DERECHA:
            Phaser.Input.Keyboard.KeyCodes.D,

        UNO:
            Phaser.Input.Keyboard.KeyCodes.ONE,

        DOS:
            Phaser.Input.Keyboard.KeyCodes.TWO,

        TRES:
            Phaser.Input.Keyboard.KeyCodes.THREE,

        Z:
            Phaser.Input.Keyboard.KeyCodes.Z,

        X:
            Phaser.Input.Keyboard.KeyCodes.X,

        C:
            Phaser.Input.Keyboard.KeyCodes.C

    });


    /* =========================
       HUD
    ========================= */

    crearHUD(this);


    /* =========================
       COLISIONES
    ========================= */

    this.physics.add.overlap(
        proyectiles,
        enemigos,
        impactoProyectilEnemigo,
        null,
        this
    );

    this.physics.add.overlap(
        jugador,
        enemigos,
        contactoEnemigo,
        null,
        this
    );

    this.physics.add.overlap(
        jugador,
        proyectilesEnemigos,
        impactoProyectilEnemigoJugador,
        null,
        this
    );


    /* =========================
       DISPARO
    ========================= */

    this.input.on(
        "pointerdown",
        disparar,
        this
    );


    /* =========================
       TEMPORIZADOR
    ========================= */

    contadorTiempo = this.time.addEvent({

        delay: 1000,

        loop: true,

        callback: () => {

            if (
                partidaIniciada &&
                !jugadorMuerto &&
                tiempoRestante > 0
            ) {

                tiempoRestante--;

                actualizarHUD();
            }
        }

    });


    /* =========================
       REDIMENSIONAMIENTO
    ========================= */

    this.scale.on(
        "resize",
        redimensionarInterfaz,
        this
    );


    /* =========================
       MENÚ
    ========================= */

    crearMenuPrincipal(this);

    actualizarHUD();
}


/* =========================================================
   ACTUALIZAR JUEGO
========================================================= */

function actualizar() {

    if (!partidaIniciada) {
        return;
    }

    if (jugadorMuerto) {
        return;
    }


    /* =========================
       MOVIMIENTO
    ========================= */

    if (!juegoCongelado) {

        jugador.body.setVelocity(0);


        if (teclado.ARRIBA.isDown) {

            jugador.body.setVelocityY(-250);
        }

        if (teclado.ABAJO.isDown) {

            jugador.body.setVelocityY(250);
        }

        if (teclado.IZQUIERDA.isDown) {

            jugador.body.setVelocityX(-250);
        }

        if (teclado.DERECHA.isDown) {

            jugador.body.setVelocityX(250);
        }


        /* =========================
           CAMBIO DE ARMA
        ========================= */

        if (
            Phaser.Input.Keyboard.JustDown(
                teclado.UNO
            )
        ) {

            cambiarArma("PISTOLA");
        }

        if (
            Phaser.Input.Keyboard.JustDown(
                teclado.DOS
            )
        ) {

            cambiarArma("RIFLE");
        }

        if (
            Phaser.Input.Keyboard.JustDown(
                teclado.TRES
            )
        ) {

            cambiarArma("ESCOPETA");
        }


        /* =========================
           ENEMIGOS
        ========================= */

        enemigos.getChildren().forEach(
            enemigo => {

                if (!enemigo.active) {
                    return;
                }

                if (
                    enemigo.tipo === "Glifo"
                ) {

                    perseguirJugador(
                        enemigo,
                        160
                    );
                }

                else if (
                    enemigo.tipo === "Vortice"
                ) {

                    comportamientoVortice(
                        enemigo
                    );
                }

                else if (
                    enemigo.tipo === "Golem"
                ) {

                    perseguirJugador(
                        enemigo,
                        50
                    );
                }
            }
        );
    }


    /* =========================
       DETENER TODO DURANTE
       LA PREGUNTA
    ========================= */

    if (juegoCongelado) {

        jugador.body.setVelocity(0);

        enemigos.getChildren().forEach(
            enemigo => {

                if (
                    enemigo.body
                ) {

                    enemigo.body.setVelocity(
                        0,
                        0
                    );
                }
            }
        );

        proyectiles.getChildren().forEach(
            bala => {

                if (bala.body) {
                    bala.body.setVelocity(
                        0,
                        0
                    );
                }
            }
        );

        proyectilesEnemigos.getChildren().forEach(
            bala => {

                if (bala.body) {
                    bala.body.setVelocity(
                        0,
                        0
                    );
                }
            }
        );
    }


    /* =========================
       FIN DE RONDA
    ========================= */

    comprobarFinRonda();
}


/* =========================================================
   HUD RESPONSIVO
========================================================= */

function crearHUD(escena) {

    textoVida = escena.add.text(
        20,
        20,
        "",
        estiloHUD()
    );

    textoTiempo = escena.add.text(
        20,
        50,
        "",
        estiloHUD()
    );

    textoArma = escena.add.text(
        20,
        80,
        "",
        estiloHUD()
    );

    textoMunicion = escena.add.text(
        20,
        110,
        "",
        estiloHUD()
    );

    textoEnemigos = escena.add.text(
        20,
        140,
        "",
        estiloHUD()
    );


    textoRonda = escena.add.text(
        0,
        20,
        "",
        {
            fontSize: "24px",
            color: "#ffffff",
            fontStyle: "bold",
            stroke: "#000000",
            strokeThickness: 5
        }
    );


    [
        textoVida,
        textoTiempo,
        textoArma,
        textoMunicion,
        textoEnemigos,
        textoRonda
    ].forEach(
        texto => {

            texto.setScrollFactor(0);

            texto.setDepth(200);

        }
    );


    actualizarHUD();
}


function estiloHUD() {

    return {

        fontSize: "18px",

        color: "#ffffff",

        fontStyle: "bold",

        stroke: "#000000",

        strokeThickness: 4

    };
}


function actualizarHUD() {

    if (!textoVida) {
        return;
    }


    textoVida.setText(
        `❤️ VIDA: ${vidaJugador} / ${vidaMaxima}`
    );

    textoTiempo.setText(
        `⏱️ TIEMPO RESTANTE: ${formatearTiempo(tiempoRestante)}`
    );

    textoArma.setText(
        `💥 ARMA: ${armaActual} (${ARMAS[armaActual].dificultad})`
    );

    textoMunicion.setText(
        `⚡ MUNICIÓN: ${municion} / ${ARMAS[armaActual].maxMunicion}`
    );

    textoEnemigos.setText(
        `👾 ENEMIGOS RESTANTES: ${enemigos ? enemigos.countActive(true) : 0}`
    );

    textoRonda.setText(
        `RONDA ${rondaActual}`
    );

    redimensionarInterfaz();
}


function formatearTiempo(segundos) {

    const minutos =
        Math.floor(segundos / 60);

    const segundosRestantes =
        segundos % 60;

    return (
        String(minutos).padStart(2, "0") +
        ":" +
        String(segundosRestantes).padStart(2, "0")
    );
}


/* =========================================================
   INTERFAZ RESPONSIVA
========================================================= */

function redimensionarInterfaz() {

    if (!escenaPrincipal) {
        return;
    }


    const ancho =
        escenaPrincipal.scale.width;

    const alto =
        escenaPrincipal.scale.height;


    /* =========================
       TAMAÑO DEL HUD
    ========================= */

    const escalaHUD =
        Phaser.Math.Clamp(
            Math.min(ancho / 800, alto / 600),
            0.75,
            1.4
        );


    [
        textoVida,
        textoTiempo,
        textoArma,
        textoMunicion,
        textoEnemigos
    ].forEach(
        texto => {

            if (texto) {

                texto.setScale(
                    escalaHUD
                );
            }
        }
    );


    if (textoRonda) {

        textoRonda.setScale(
            escalaHUD
        );

        textoRonda.setPosition(
            ancho - 20,
            20
        );

        textoRonda.setOrigin(
            1,
            0
        );
    }


    /* =========================
       CONTROLES
    ========================= */

    if (
        escenaPrincipal.textoControles
    ) {

        escenaPrincipal.textoControles.setPosition(
            20,
            alto - 25
        );

        escenaPrincipal.textoControles.setOrigin(
            0,
            1
        );
    }


    /* =========================
       MENÚ PRINCIPAL
    ========================= */

    if (menuPrincipal) {

        menuPrincipal.setPosition(
            ancho / 2,
            alto / 2
        );
    }


    /* =========================
       OVERLAY
    ========================= */

    if (overlayActual) {

        overlayActual.setPosition(
            ancho / 2,
            alto / 2
        );

        ajustarOverlay(
            overlayActual,
            ancho,
            alto
        );
    }
}


/* =========================================================
   MENÚ PRINCIPAL
========================================================= */

function crearMenuPrincipal(escena) {

    menuPrincipal =
        escena.add.container(
            escena.scale.width / 2,
            escena.scale.height / 2
        );

    menuPrincipal.setScrollFactor(0);
    menuPrincipal.setDepth(100);


    const fondo =
        escena.add.rectangle(
            0,
            0,
            10000,
            10000,
            0x101018,
            0.92
        );

    fondo.setScrollFactor(0);

    menuPrincipal.add(
        fondo
    );


    const titulo =
        escena.add.text(
            0,
            -150,
            "CALABOZO DE LA CADENA",
            {
                fontSize: "42px",
                color: "#ffffff",
                fontStyle: "bold",
                stroke: "#000000",
                strokeThickness: 7,
                align: "center"
            }
        );

    titulo.setOrigin(0.5);

    menuPrincipal.add(
        titulo
    );


    const botonJugar =
        crearBoton(
            escena,
            "▶ JUGAR",
            0,
            -40,
            () => {

                menuPrincipal.setVisible(
                    false
                );

                iniciarPartida();
            }
        );


    const botonControles =
        crearBoton(
            escena,
            "🎮 CONTROLES",
            0,
            40,
            () => {

                menuPrincipal.setVisible(
                    false
                );

                mostrarControles(
                    escena
                );
            }
        );


    const botonCreditos =
        crearBoton(
            escena,
            "📜 CRÉDITOS",
            0,
            120,
            () => {

                menuPrincipal.setVisible(
                    false
                );

                mostrarCreditos(
                    escena
                );
            }
        );


    menuPrincipal.add(
        botonJugar
    );

    menuPrincipal.add(
        botonControles
    );

    menuPrincipal.add(
        botonCreditos
    );


    escena.input.setTopOnly(true);

    redimensionarInterfaz();
}


/* =========================================================
   CREAR BOTÓN
========================================================= */

function crearBoton(
    escena,
    texto,
    x,
    y,
    callback
) {

    const boton =
        escena.add.container(
            x,
            y
        );

    boton.setSize(
        300,
        60
    );

    const fondo =
        escena.add.rectangle(
            0,
            0,
            300,
            60,
            0x303044
        );

    const textoBoton =
        escena.add.text(
            0,
            0,
            texto,
            {
                fontSize: "22px",
                color: "#ffffff",
                fontStyle: "bold"
            }
        );

    textoBoton.setOrigin(
        0.5
    );


    boton.add(
        fondo
    );

    boton.add(
        textoBoton
    );


    boton.setInteractive(
        new Phaser.Geom.Rectangle(
            -150,
            -30,
            300,
            60
        ),
        Phaser.Geom.Rectangle.Contains
    );


    boton.input.cursor =
        "pointer";


    boton.on(
        "pointerover",
        () => {

            fondo.setFillStyle(
                0x4b4b6b
            );
        }
    );


    boton.on(
        "pointerout",
        () => {

            fondo.setFillStyle(
                0x303044
            );
        }
    );


    boton.on(
        "pointerdown",
        (pointer, localX, localY, event) => {

            if (event) {
                event.stopPropagation();
            }

            callback();
        }
    );


    boton.setScrollFactor(0);

    boton.setDepth(101);

    return boton;
}


/* =========================================================
   INICIAR PARTIDA
========================================================= */

function iniciarPartida() {

    partidaIniciada = true;

    juegoCongelado = false;

    jugadorMuerto = false;

    invulnerable = false;

    vidaJugador = vidaMaxima;

    tiempoRestante = tiempoLimite;

    rondaActual = 1;

    generandoNuevaRonda = false;

    armaActual = "PISTOLA";

    municion =
        ARMAS[armaActual].maxMunicion;


    jugador.setPosition(
        1200,
        1200
    );

    jugador.setAlpha(1);


    enemigos.clear(
        true,
        true
    );

    proyectiles.clear(
        true,
        true
    );

    proyectilesEnemigos.clear(
        true,
        true
    );


    escenaPrincipal.cameras.main
        .startFollow(
            jugador,
            true
        );


    if (
        escenaPrincipal.textoControles
    ) {

        escenaPrincipal.textoControles.destroy();

        escenaPrincipal.textoControles =
            null;
    }


    crearTextoControles();

    actualizarHUD();

    iniciarRonda(
        escenaPrincipal
    );
}


/* =========================================================
   TEXTO DE CONTROLES
========================================================= */

function crearTextoControles() {

    const escena =
        escenaPrincipal;

    escena.textoControles =
        escena.add.text(
            20,
            escena.scale.height - 25,
            "WASD: Mover | Click: Disparar | 1/2/3: Cambiar arma",
            {
                fontSize: "16px",
                color: "#ffffff",
                stroke: "#000000",
                strokeThickness: 4
            }
        );

    escena.textoControles.setScrollFactor(0);

    escena.textoControles.setDepth(200);

    escena.textoControles.setOrigin(
        0,
        1
    );

    redimensionarInterfaz();
}


/* =========================================================
   CAMBIAR ARMA
========================================================= */

function cambiarArma(
    nuevaArma
) {

    armaActual = nuevaArma;

    municion =
        ARMAS[armaActual].maxMunicion;

    actualizarHUD();
}


/* =========================================================
   DISPARAR
========================================================= */

function disparar(
    pointer
) {

    if (
        !partidaIniciada ||
        juegoCongelado ||
        jugadorMuerto
    ) {
        return;
    }


    if (
        municion <= 0
    ) {

        iniciarRecargaMatematica();

        return;
    }


    const camara =
        escenaPrincipal.cameras.main;


    const mundoX =
        pointer.worldX;

    const mundoY =
        pointer.worldY;


    const angulo =
        Phaser.Math.Angle.Between(
            jugador.x,
            jugador.y,
            mundoX,
            mundoY
        );


    const bala =
        escenaPrincipal.add.circle(
            jugador.x,
            jugador.y,
            7,
            0xffff00
        );


    escenaPrincipal.physics.add
        .existing(bala);


    bala.body.setVelocity(
        Math.cos(angulo) *
        ARMAS[armaActual].velocidad,

        Math.sin(angulo) *
        ARMAS[armaActual].velocidad
    );


    bala.body.setCollideWorldBounds(
        false
    );


    bala.dano =
        ARMAS[armaActual].danoGlifo;


    bala.danoVortice =
        ARMAS[armaActual].danoVortice;


    bala.danoGolem =
        ARMAS[armaActual].danoGolem;


    proyectiles.add(
        bala
    );


    municion--;

    actualizarHUD();


    if (
        municion <= 0
    ) {

        iniciarRecargaMatematica();
    }
}


/* =========================================================
   RECARGA MATEMÁTICA
========================================================= */

function iniciarRecargaMatematica() {

    if (
        juegoCongelado ||
        jugadorMuerto
    ) {
        return;
    }


    juegoCongelado = true;


    const dificultad =
        ARMAS[armaActual].dificultad;


    const preguntas =
        BANCO_PREGUNTAS[dificultad];


    mostrarPregunta(
        preguntas[0],
        0,
        preguntas
    );
}


function mostrarPregunta(
    pregunta,
    indice,
    preguntas
) {

    const escena =
        escenaPrincipal;


    const ancho =
        escena.scale.width;

    const alto =
        escena.scale.height;


    if (overlayActual) {

        overlayActual.destroy();

        overlayActual = null;
    }


    overlayActual =
        escena.add.container(
            ancho / 2,
            alto / 2
        );


    overlayActual.setScrollFactor(0);

    overlayActual.setDepth(500);


    const fondo =
        escena.add.rectangle(
            0,
            0,
            Math.min(
                ancho * 0.85,
                650
            ),
            Math.min(
                alto * 0.75,
                400
            ),
            0x11111a,
            0.97
        );


    overlayActual.add(
        fondo
    );


    const titulo =
        escena.add.text(
            0,
            -130,
            "RECARGA MATEMÁTICA",
            {
                fontSize: "28px",
                color: "#ffff00",
                fontStyle: "bold",
                align: "center"
            }
        );

    titulo.setOrigin(0.5);


    const textoPregunta =
        escena.add.text(
            0,
            -65,
            pregunta.pregunta,
            {
                fontSize: "20px",
                color: "#ffffff",
                align: "center",
                wordWrap: {
                    width:
                        Math.min(
                            ancho * 0.72,
                            560
                        )
                }
            }
        );

    textoPregunta.setOrigin(0.5);


    const opciones = [];


    const posicionesY =
        [30, 85, 140];


    pregunta.opciones.forEach(
        (opcion, i) => {

            const letras =
                ["Z", "X", "C"];


            const texto =
                escena.add.text(
                    0,
                    posicionesY[i],
                    `${letras[i]}) ${opcion}`,
                    {
                        fontSize: "19px",
                        color: "#ffffff",
                        align: "center",
                        wordWrap: {
                            width:
                                Math.min(
                                    ancho * 0.72,
                                    560
                                )
                        }
                    }
                );

            texto.setOrigin(
                0.5
            );


            overlayActual.add(
                texto
            );

            opciones.push(
                texto
            );
        }
    );


    overlayActual.add(
        titulo
    );

    overlayActual.add(
        textoPregunta
    );


    overlayActual.setData(
        "opciones",
        opciones
    );


    escena.input.keyboard.once(
        "keydown-Z",
        () => {

            responderPregunta(
                0,
                pregunta,
                indice,
                preguntas
            );
        }
    );


    escena.input.keyboard.once(
        "keydown-X",
        () => {

            responderPregunta(
                1,
                pregunta,
                indice,
                preguntas
            );
        }
    );


    escena.input.keyboard.once(
        "keydown-C",
        () => {

            responderPregunta(
                2,
                pregunta,
                indice,
                preguntas
            );
        }
    );


    redimensionarInterfaz();
}


function responderPregunta(
    respuesta,
    pregunta,
    indice,
    preguntas
) {

    if (
        !juegoCongelado
    ) {
        return;
    }


    if (
        respuesta === pregunta.correcta
    ) {

        if (indice + 1 < preguntas.length) {

            mostrarPregunta(
                preguntas[indice + 1],
                indice + 1,
                preguntas
            );

        } else {

            municion =
                ARMAS[armaActual].maxMunicion;

            juegoCongelado = false;


            if (overlayActual) {

                overlayActual.destroy();

                overlayActual = null;
            }


            actualizarHUD();
        }

    } else {

        escenaPrincipal.cameras.main.flash(
            150,
            255,
            0,
            0
        );
    }
}


/* =========================================================
   CREAR ENEMIGO
========================================================= */

function crearEnemigo(
    escena,
    tipo
) {

    let x;
    let y;

    do {

        x =
            Phaser.Math.Between(
                100,
                2300
            );

        y =
            Phaser.Math.Between(
                100,
                2300
            );

    } while (
        Phaser.Math.Distance.Between(
            x,
            y,
            jugador.x,
            jugador.y
        ) < 400
    );


    let enemigo;

    let color;
    let tamano;
    let vida;
    let velocidad;


    if (
        tipo === "Glifo"
    ) {

        color = 0x00ffff;

        tamano = 32;

        vida = 20;

        velocidad = 160;
    }


    if (
        tipo === "Vortice"
    ) {

        color = 0xff00ff;

        tamano = 32;

        vida = 20;

        velocidad = 80;
    }


    if (
        tipo === "Golem"
    ) {

        color = 0xff8800;

        tamano = 48;

        vida = 150;

        velocidad = 50;
    }


    enemigo =
        escena.add.rectangle(
            x,
            y,
            tamano,
            tamano,
            color
        );


    escena.physics.add.existing(
        enemigo
    );


    enemigo.body.setCollideWorldBounds(
        true
    );


    enemigo.tipo = tipo;

    enemigo.vida = vida;

    enemigo.vidaMaxima = vida;

    enemigo.velocidad = velocidad;

    enemigo.ultimoDisparo = 0;


    enemigos.add(
        enemigo
    );
}


/* =========================================================
   COMPORTAMIENTO GLIFO / GOLEM
========================================================= */

function perseguirJugador(
    enemigo,
    velocidad
) {

    if (
        juegoCongelado
    ) {
        enemigo.body.setVelocity(
            0,
            0
        );

        return;
    }


    const angulo =
        Phaser.Math.Angle.Between(
            enemigo.x,
            enemigo.y,
            jugador.x,
            jugador.y
        );


    enemigo.body.setVelocity(
        Math.cos(angulo) *
        velocidad,

        Math.sin(angulo) *
        velocidad
    );
}


/* =========================================================
   VORTICE
========================================================= */

function comportamientoVortice(
    enemigo
) {

    if (
        juegoCongelado
    ) {

        enemigo.body.setVelocity(
            0,
            0
        );

        return;
    }


    const distancia =
        Phaser.Math.Distance.Between(
            enemigo.x,
            enemigo.y,
            jugador.x,
            jugador.y
        );


    if (
        distancia > 350
    ) {

        perseguirJugador(
            enemigo,
            80
        );

    } else {

        enemigo.body.setVelocity(
            0,
            0
        );
    }


    const ahora =
        escenaPrincipal.time.now;


    if (
        distancia <= 600 &&
        ahora - enemigo.ultimoDisparo > 2000
    ) {

        disparoVortice(
            enemigo
        );

        enemigo.ultimoDisparo =
            ahora;
    }
}


/* =========================================================
   DISPARO DEL VORTICE
========================================================= */

function disparoVortice(
    enemigo
) {

    const angulo =
        Phaser.Math.Angle.Between(
            enemigo.x,
            enemigo.y,
            jugador.x,
            jugador.y
        );


    const bala =
        escenaPrincipal.add.circle(
            enemigo.x,
            enemigo.y,
            8,
            0xff00ff
        );


    escenaPrincipal.physics.add
        .existing(bala);


    bala.body.setVelocity(
        Math.cos(angulo) * 220,
        Math.sin(angulo) * 220
    );


    bala.dano = 10;


    proyectilesEnemigos.add(
        bala
    );


    escenaPrincipal.time.delayedCall(
        5000,
        () => {

            if (
                bala.active
            ) {

                bala.destroy();
            }
        }
    );
}


/* =========================================================
   IMPACTO PROYECTIL ENEMIGO
========================================================= */

function impactoProyectilEnemigo(
    bala,
    enemigo
) {

    if (
        !bala.active ||
        !enemigo.active
    ) {
        return;
    }


    let dano = bala.dano;


    if (
        enemigo.tipo === "Vortice"
    ) {

        dano =
            bala.danoVortice;
    }


    if (
        enemigo.tipo === "Golem"
    ) {

        dano =
            bala.danoGolem;
    }


    enemigo.vida -= dano;


    bala.destroy();


    if (
        enemigo.vida <= 0
    ) {

        enemigo.destroy();
    }


    actualizarHUD();
}


/* =========================================================
   CONTACTO ENEMIGO
========================================================= */

function contactoEnemigo(
    jugador,
    enemigo
) {

    if (
        !enemigo.active ||
        enemigo.tipo === "Vortice"
    ) {
        return;
    }


    if (
        invulnerable
    ) {
        return;
    }


    let dano = 10;


    if (
        enemigo.tipo === "Golem"
    ) {

        dano = 20;
    }


    recibirDanio(
        dano
    );
}


/* =========================================================
   PROYECTIL ENEMIGO CONTRA JUGADOR
========================================================= */

function impactoProyectilEnemigoJugador(
    jugador,
    bala
) {

    if (
        !bala.active
    ) {
        return;
    }


    bala.destroy();


    if (
        invulnerable
    ) {
        return;
    }


    recibirDanio(
        bala.dano
    );
}


/* =========================================================
   DAÑO AL JUGADOR
========================================================= */

function recibirDanio(
    dano
) {

    if (
        invulnerable ||
        jugadorMuerto
    ) {
        return;
    }


    vidaJugador -= dano;


    if (
        vidaJugador < 0
    ) {

        vidaJugador = 0;
    }


    actualizarHUD();


    invulnerable = true;

    jugador.setAlpha(
        0.4
    );


    escenaPrincipal.time.delayedCall(
        500,
        () => {

            invulnerable = false;

            if (
                jugador.active
            ) {

                jugador.setAlpha(
                    1
                );
            }
        }
    );


    if (
        vidaJugador <= 0
    ) {

        matarJugador();
    }
}


/* =========================================================
   MUERTE DEL JUGADOR
========================================================= */

function matarJugador() {

    jugadorMuerto = true;

    juegoCongelado = true;


    enemigos.getChildren().forEach(
        enemigo => {

            if (enemigo.body) {

                enemigo.body.setVelocity(
                    0,
                    0
                );
            }
        }
    );


    proyectilesEnemigos.getChildren().forEach(
        bala => {

            if (bala.body) {

                bala.body.setVelocity(
                    0,
                    0
                );
            }
        }
    );


    mostrarPantallaMuerte();
}


/* =========================================================
   PANTALLA DE MUERTE
========================================================= */

function mostrarPantallaMuerte() {

    const escena =
        escenaPrincipal;


    if (overlayActual) {

        overlayActual.destroy();

        overlayActual = null;
    }


    overlayActual =
        escena.add.container(
            escena.scale.width / 2,
            escena.scale.height / 2
        );


    overlayActual.setScrollFactor(0);

    overlayActual.setDepth(1000);


    const fondo =
        escena.add.rectangle(
            0,
            0,
            escena.scale.width,
            escena.scale.height,
            0x000000,
            0.8
        );


    const titulo =
        escena.add.text(
            0,
            -70,
            "HAS MUERTO",
            {
                fontSize: "52px",
                color: "#ff3333",
                fontStyle: "bold",
                stroke: "#000000",
                strokeThickness: 8
            }
        );

    titulo.setOrigin(0.5);


    const informacion =
        escena.add.text(
            0,
            20,
            `Llegaste a la ronda ${rondaActual}\n\nRecarga la página para volver a jugar`,
            {
                fontSize: "22px",
                color: "#ffffff",
                align: "center",
                wordWrap: {
                    width:
                        Math.min(
                            escena.scale.width * 0.8,
                            600
                        )
                }
            }
        );

    informacion.setOrigin(0.5);


    overlayActual.add(
        fondo
    );

    overlayActual.add(
        titulo
    );

    overlayActual.add(
        informacion
    );
}


/* =========================================================
   RONDAS
========================================================= */

function iniciarRonda(
    escena
) {

    generandoNuevaRonda = false;


    let glifos = 0;
    let vortices = 0;
    let golems = 0;


    if (
        rondaActual === 1
    ) {

        glifos = 5;
    }

    else if (
        rondaActual === 2
    ) {

        vortices = 4;
    }

    else if (
        rondaActual === 3
    ) {

        glifos = 6;

        vortices = 4;
    }

    else if (
        rondaActual === 4
    ) {

        golems = 3;
    }

    else {

        const aumento =
            rondaActual - 5;


        glifos =
            6 + aumento * 2;


        vortices =
            4 + aumento;


        golems =
            2 +
            Math.floor(
                aumento / 2
            );
    }


    for (
        let i = 0;
        i < glifos;
        i++
    ) {

        crearEnemigo(
            escena,
            "Glifo"
        );
    }


    for (
        let i = 0;
        i < vortices;
        i++
    ) {

        crearEnemigo(
            escena,
            "Vortice"
        );
    }


    for (
        let i = 0;
        i < golems;
        i++
    ) {

        crearEnemigo(
            escena,
            "Golem"
        );
    }


    mostrarRonda();

    actualizarHUD();
}


/* =========================================================
   MOSTRAR RONDA
========================================================= */

function mostrarRonda() {

    escenaPrincipal.cameras.main.flash(
        250,
        255,
        255,
        255
    );
}


/* =========================================================
   COMPROBAR FIN DE RONDA
========================================================= */

function comprobarFinRonda() {

    if (
        !partidaIniciada ||
        jugadorMuerto ||
        generandoNuevaRonda
    ) {
        return;
    }


    if (
        enemigos.countActive(true) === 0
    ) {

        generandoNuevaRonda = true;


        escenaPrincipal.time.delayedCall(
            1000,
            () => {

                if (
                    jugadorMuerto
                ) {
                    return;
                }


                rondaActual++;


                iniciarRonda(
                    escenaPrincipal
                );

            }
        );
    }
}

/* =========================================================
   OVERLAY INFORMACIÓN
========================================================= */

function crearOverlayInformativo(
    escena,
    tituloTexto,
    lineas
) {

    if (overlayActual) {

        overlayActual.destroy();

        overlayActual = null;
    }


    overlayActual =
        escena.add.container(
            escena.scale.width / 2,
            escena.scale.height / 2
        );


    overlayActual.setScrollFactor(0);

    overlayActual.setDepth(600);


    const fondo =
        escena.add.rectangle(
            0,
            0,
            Math.min(
                escena.scale.width * 0.9,
                650
            ),
            Math.min(
                escena.scale.height * 0.85,
                500
            ),
            0x11111a,
            0.98
        );


    const titulo =
        escena.add.text(
            0,
            -180,
            tituloTexto,
            {
                fontSize: "38px",
                color: "#ffffff",
                fontStyle: "bold",
                stroke: "#000000",
                strokeThickness: 6,
                align: "center"
            }
        );

    titulo.setOrigin(
        0.5
    );


    const contenido =
        escena.add.text(
            0,
            -70,
            lineas.join("\n"),
            {
                fontSize: "21px",
                color: "#ffffff",
                align: "center",
                lineSpacing: 8,
                wordWrap: {
                    width:
                        Math.min(
                            escena.scale.width * 0.75,
                            520
                        )
                }
            }
        );

    contenido.setOrigin(
        0.5
    );


    const volver =
        crearBoton(
            escena,
            "← VOLVER",
            0,
            170,
            () => {

                if (
                    overlayActual
                ) {

                    overlayActual.destroy();

                    overlayActual =
                        null;
                }


                menuPrincipal.setVisible(
                    true
                );


                redimensionarInterfaz();
            }
        );


    overlayActual.add(
        fondo
    );

    overlayActual.add(
        titulo
    );

    overlayActual.add(
        contenido
    );

    overlayActual.add(
        volver
    );


    redimensionarInterfaz();
}


/* =========================================================
   AJUSTAR OVERLAY
========================================================= */

function ajustarOverlay(
    overlay,
    ancho,
    alto
) {

    if (!overlay) {
        return;
    }


    const fondo =
        overlay.list.find(
            elemento =>
                elemento.type === "Rectangle"
        );


    if (fondo) {

        fondo.setSize(
            Math.min(
                ancho * 0.9,
                650
            ),
            Math.min(
                alto * 0.85,
                500
            )
        );
    }


    const textos =
        overlay.list.filter(
            elemento =>
                elemento.type === "Text"
        );


    textos.forEach(
        texto => {

            texto.setScale(
                Phaser.Math.Clamp(
                    Math.min(
                        ancho / 800,
                        alto / 600
                    ),
                    0.75,
                    1.25
                )
            );
        }
    );
}
