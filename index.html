<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calabozo de la Cadena</title>

<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    background:#1a1a24;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#canvas-container{
    width:100vw;
    height:100vh;
    overflow:hidden;
}

canvas{
    display:block;
    touch-action:none;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

</head>

<body>
<div id="canvas-container"></div>

<script>

const ANCHO_MUNDO=2400;
const ALTO_MUNDO=2400;

let jugador;
let enemigos;
let proyectiles;
let proyectilesEnemigos;

let teclado;

let partidaIniciada=false;
let juegoCongelado=false;
let jugadorMuerto=false;
let invulnerable=false;

let vidaJugador=100;
let vidaMaxima=100;

let tiempoLimite=900;
let tiempoRestante=tiempoLimite;

let rondaActual=1;
let generandoNuevaRonda=false;

let armaActual="PISTOLA";
let municion=6;

let textoVida;
let textoTiempo;
let textoArma;
let textoMunicion;
let textoEnemigos;
let textoRonda;

let contadorTiempo;
let escenaPrincipal;

let menuPrincipal;
let overlayActual=null;


const ARMAS={

PISTOLA:{
maxMunicion:6,
danoGlifo:20,
danoVortice:20,
danoGolem:10,
velocidad:450,
dificultad:"Fácil"
},

RIFLE:{
maxMunicion:15,
danoGlifo:10,
danoVortice:10,
danoGolem:10,
velocidad:650,
dificultad:"Medio"
},

ESCOPETA:{
maxMunicion:2,
danoGlifo:76,
danoVortice:76,
danoGolem:76,
velocidad:350,
dificultad:"Difícil"
}

};


const BANCO_PREGUNTAS={

Fácil:[
{
pregunta:"y = (3x - 1)⁵\n¿Cuál es la derivada?",
opciones:[
"5(3x - 1)⁴",
"5(3x - 1)⁵",
"(3x - 1)⁴"
],
correcta:0
},
{
pregunta:"En y = (3x - 1)⁵,\n¿cuál es la derivada interna?",
opciones:["3x","3","1"],
correcta:1
}
],

Medio:[
{
pregunta:"y = cos(x³)\n¿Cuál es la derivada externa?",
opciones:["sin(x³)","-sin(x³)","-cos(x³)"],
correcta:1
},
{
pregunta:"y = cos(x³)\n¿Cuál es la derivada interna?",
opciones:["3x²","3x","x²"],
correcta:0
}
],

Difícil:[
{
pregunta:"y = ln(sin(x))\n¿Cuál es la derivada externa?",
opciones:["1/x","1/sin(x)","cos(x)"],
correcta:1
},
{
pregunta:"y = ln(sin(x))\n¿Cuál es la derivada interna?",
opciones:["cos(x)","-cos(x)","1/cos(x)"],
correcta:0
}
]

};


const config={

type:Phaser.AUTO,

parent:"canvas-container",

backgroundColor:"#1a1a24",

scale:{
mode:Phaser.Scale.RESIZE,
autoCenter:Phaser.Scale.CENTER_BOTH
},

physics:{
default:"arcade",
arcade:{
gravity:{y:0},
debug:false
}
},

scene:{
create:crear,
update:actualizar
}

};


new Phaser.Game(config);


/* =========================
   CREAR
========================= */

function crear(){

escenaPrincipal=this;

this.physics.world.setBounds(
0,0,ANCHO_MUNDO,ALTO_MUNDO
);


/* MAPA */

const graphics=this.add.graphics();

graphics.lineStyle(1,0x292936,1);

for(let x=0;x<=ANCHO_MUNDO;x+=80)
graphics.lineBetween(x,0,x,ALTO_MUNDO);

for(let y=0;y<=ALTO_MUNDO;y+=80)
graphics.lineBetween(0,y,ANCHO_MUNDO,y);


/* JUGADOR */

jugador=this.add.rectangle(
1200,1200,32,32,0x00ff66
);

this.physics.add.existing(jugador);

jugador.body.setCollideWorldBounds(true);


/* GRUPOS */

enemigos=this.physics.add.group();
proyectiles=this.physics.add.group();
proyectilesEnemigos=this.physics.add.group();


/* CÁMARA */

this.cameras.main.setBounds(
0,0,ANCHO_MUNDO,ALTO_MUNDO
);

this.cameras.main.startFollow(
jugador,true
);


/* TECLADO */

teclado=this.input.keyboard.addKeys({

ARRIBA:Phaser.Input.Keyboard.KeyCodes.W,
ABAJO:Phaser.Input.Keyboard.KeyCodes.S,
IZQUIERDA:Phaser.Input.Keyboard.KeyCodes.A,
DERECHA:Phaser.Input.Keyboard.KeyCodes.D,

UNO:Phaser.Input.Keyboard.KeyCodes.ONE,
DOS:Phaser.Input.Keyboard.KeyCodes.TWO,
TRES:Phaser.Input.Keyboard.KeyCodes.THREE,

Z:Phaser.Input.Keyboard.KeyCodes.Z,
X:Phaser.Input.Keyboard.KeyCodes.X,
C:Phaser.Input.Keyboard.KeyCodes.C

});


crearHUD(this);


/* COLISIONES */

this.physics.add.overlap(
proyectiles,
enemigos,
impactoProyectilEnemigo,
null,
this
);

this.physics.add.overlap(
jugador,
enemigos,
contactoEnemigo,
null,
this
);

this.physics.add.overlap(
jugador,
proyectilesEnemigos,
impactoProyectilEnemigoJugador,
null,
this
);


/* DISPARO */

this.input.on(
"pointerdown",
disparar,
this
);


/* TIEMPO */

contadorTiempo=this.time.addEvent({

delay:1000,
loop:true,

callback:()=>{

if(
partidaIniciada &&
!jugadorMuerto &&
tiempoRestante>0
){

tiempoRestante--;
actualizarHUD();

}

}

});


/* RESPONSIVE */

this.scale.on(
"resize",
redimensionarInterfaz,
this
);

this.input.setTopOnly(true);

crearMenuPrincipal(this);

actualizarHUD();

}


/* =========================
   UPDATE
========================= */

function actualizar(){

if(!partidaIniciada||jugadorMuerto)
return;


/* MOVIMIENTO */

if(!juegoCongelado){

jugador.body.setVelocity(0);

if(teclado.ARRIBA.isDown)
jugador.body.setVelocityY(-250);

if(teclado.ABAJO.isDown)
jugador.body.setVelocityY(250);

if(teclado.IZQUIERDA.isDown)
jugador.body.setVelocityX(-250);

if(teclado.DERECHA.isDown)
jugador.body.setVelocityX(250);


if(Phaser.Input.Keyboard.JustDown(teclado.UNO))
cambiarArma("PISTOLA");

if(Phaser.Input.Keyboard.JustDown(teclado.DOS))
cambiarArma("RIFLE");

if(Phaser.Input.Keyboard.JustDown(teclado.TRES))
cambiarArma("ESCOPETA");


enemigos.getChildren().forEach(enemigo=>{

if(!enemigo.active)return;

if(enemigo.tipo==="Glifo")
perseguirJugador(enemigo,160);

else if(enemigo.tipo==="Vortice")
comportamientoVortice(enemigo);

else if(enemigo.tipo==="Golem")
perseguirJugador(enemigo,50);

});

}


/* DETENER DURANTE PREGUNTA */

if(juegoCongelado){

jugador.body.setVelocity(0);

enemigos.getChildren().forEach(e=>{
if(e.body)e.body.setVelocity(0,0);
});

proyectiles.getChildren().forEach(b=>{
if(b.body)b.body.setVelocity(0,0);
});

proyectilesEnemigos.getChildren().forEach(b=>{
if(b.body)b.body.setVelocity(0,0);
});

}


comprobarFinRonda();

}


/* =========================
   HUD
========================= */

function estiloHUD(){

return{
fontSize:"18px",
color:"#ffffff",
fontStyle:"bold",
stroke:"#000000",
strokeThickness:4
};

}


function crearHUD(escena){

textoVida=escena.add.text(20,20,"",estiloHUD());
textoTiempo=escena.add.text(20,50,"",estiloHUD());
textoArma=escena.add.text(20,80,"",estiloHUD());
textoMunicion=escena.add.text(20,110,"",estiloHUD());
textoEnemigos=escena.add.text(20,140,"",estiloHUD());

textoRonda=escena.add.text(
0,20,"",
{
fontSize:"24px",
color:"#ffffff",
fontStyle:"bold",
stroke:"#000000",
strokeThickness:5
}
);

[
textoVida,
textoTiempo,
textoArma,
textoMunicion,
textoEnemigos,
textoRonda
].forEach(t=>{
t.setScrollFactor(0);
t.setDepth(200);
});

}


function actualizarHUD(){

if(!textoVida)return;

textoVida.setText(
`❤️ VIDA: ${vidaJugador} / ${vidaMaxima}`
);

textoTiempo.setText(
`⏱️ TIEMPO RESTANTE: ${formatearTiempo(tiempoRestante)}`
);

textoArma.setText(
`💥 ARMA: ${armaActual} (${ARMAS[armaActual].dificultad})`
);

textoMunicion.setText(
`⚡ MUNICIÓN: ${municion} / ${ARMAS[armaActual].maxMunicion}`
);

textoEnemigos.setText(
`👾 ENEMIGOS RESTANTES: ${enemigos?enemigos.countActive(true):0}`
);

textoRonda.setText(
`RONDA ${rondaActual}`
);

redimensionarInterfaz();

}


function formatearTiempo(segundos){

return String(Math.floor(segundos/60)).padStart(2,"0")
+
":"
+
String(segundos%60).padStart(2,"0");

}


/* =========================
   RESPONSIVE
========================= */

function redimensionarInterfaz(){

if(!escenaPrincipal)return;

const ancho=escenaPrincipal.scale.width;
const alto=escenaPrincipal.scale.height;


/*
    El HUD mantiene su tamaño legible.
    Solo cambia su posición según el tamaño
    disponible de la pantalla.
*/

const escalaHUD=Phaser.Math.Clamp(
Math.min(ancho/800,alto/600),
0.8,
1.25
);


[
textoVida,
textoTiempo,
textoArma,
textoMunicion,
textoEnemigos
].forEach(t=>{

if(t){

t.setScale(escalaHUD);

t.setPosition(
20,
20 + [
textoVida,
textoTiempo,
textoArma,
textoMunicion,
textoEnemigos
].indexOf(t)*30
);

}

});


if(textoRonda){

textoRonda.setScale(escalaHUD);

textoRonda.setPosition(
ancho-20,
20
);

textoRonda.setOrigin(1,0);

}


if(escenaPrincipal.textoControles){

escenaPrincipal.textoControles.setPosition(
20,
alto-20
);

escenaPrincipal.textoControles.setScale(
Phaser.Math.Clamp(
Math.min(ancho/800,alto/600),
0.8,
1.25
)
);

}


if(menuPrincipal){

menuPrincipal.setPosition(
ancho/2,
alto/2
);

const escalaMenu=Phaser.Math.Clamp(
Math.min(ancho/800,alto/600),
0.7,
1
);

menuPrincipal.setScale(escalaMenu);

}


if(overlayActual){

overlayActual.setPosition(
ancho/2,
alto/2
);

const escalaOverlay=Phaser.Math.Clamp(
Math.min(ancho/800,alto/600),
0.7,
1
);

overlayActual.setScale(escalaOverlay);

}

}


/* =========================
   DISPARO
========================= */

function disparar(pointer){

if(
!partidaIniciada||
juegoCongelado||
jugadorMuerto
)
return;


if(municion<=0){

iniciarRecargaMatematica();

return;

}


const mundoX=pointer.worldX;
const mundoY=pointer.worldY;

const angulo=Phaser.Math.Angle.Between(
jugador.x,
jugador.y,
mundoX,
mundoY
);


/* PROYECTIL */

const bala=escenaPrincipal.add.circle(
jugador.x,
jugador.y,
7,
0xffff00
);

escenaPrincipal.physics.add.existing(bala);


/*
    Se mantiene el sistema de movimiento original:
    setVelocity() de Arcade Physics.
*/

bala.body.setVelocity(
Math.cos(angulo)*
ARMAS[armaActual].velocidad,
Math.sin(angulo)*
ARMAS[armaActual].velocidad
);


bala.dano=ARMAS[armaActual].danoGlifo;
bala.danoVortice=ARMAS[armaActual].danoVortice;
bala.danoGolem=ARMAS[armaActual].danoGolem;


proyectiles.add(bala);


escenaPrincipal.time.delayedCall(
5000,
()=>{
if(bala.active)
bala.destroy();
}
);


municion--;

actualizarHUD();


if(municion<=0)
iniciarRecargaMatematica();

}


/* =========================
   CAMBIO ARMA
========================= */

function cambiarArma(arma){

armaActual=arma;

municion=ARMAS[arma].maxMunicion;

actualizarHUD();

}


/* =========================
   ENEMIGOS
========================= */

function crearEnemigo(escena,tipo){

let x,y;

do{

x=Phaser.Math.Between(100,2300);
y=Phaser.Math.Between(100,2300);

}while(
Phaser.Math.Distance.Between(
x,y,jugador.x,jugador.y
)<400
);


let color,tamano,vida,velocidad;

if(tipo==="Glifo"){
color=0x00ffff;
tamano=32;
vida=20;
velocidad=160;
}

if(tipo==="Vortice"){
color=0xff00ff;
tamano=32;
vida=20;
velocidad=80;
}

if(tipo==="Golem"){
color=0xff8800;
tamano=48;
vida=150;
velocidad=50;
}


const enemigo=escena.add.rectangle(
x,y,tamano,tamano,color
);

escena.physics.add.existing(enemigo);

enemigo.body.setCollideWorldBounds(true);

enemigo.tipo=tipo;
enemigo.vida=vida;
enemigo.vidaMaxima=vida;
enemigo.velocidad=velocidad;
enemigo.ultimoDisparo=0;

enemigos.add(enemigo);

}


function perseguirJugador(enemigo,velocidad){

if(juegoCongelado){

enemigo.body.setVelocity(0,0);
return;

}

const angulo=Phaser.Math.Angle.Between(
enemigo.x,
enemigo.y,
jugador.x,
jugador.y
);

enemigo.body.setVelocity(
Math.cos(angulo)*velocidad,
Math.sin(angulo)*velocidad
);

}


/* =========================
   VORTICE
========================= */

function comportamientoVortice(enemigo){

if(juegoCongelado){

enemigo.body.setVelocity(0,0);
return;

}

const distancia=Phaser.Math.Distance.Between(
enemigo.x,
enemigo.y,
jugador.x,
jugador.y
);


if(distancia>350)
perseguirJugador(enemigo,80);
else
enemigo.body.setVelocity(0,0);


const ahora=escenaPrincipal.time.now;

if(
distancia<=600 &&
ahora-enemigo.ultimoDisparo>2000
){

disparoVortice(enemigo);

enemigo.ultimoDisparo=ahora;

}

}


/* =========================
   PROYECTIL VORTICE
========================= */

function disparoVortice(enemigo){

const angulo=Phaser.Math.Angle.Between(
enemigo.x,
enemigo.y,
jugador.x,
jugador.y
);


const bala=escenaPrincipal.add.circle(
enemigo.x,
enemigo.y,
8,
0xff00ff
);

escenaPrincipal.physics.add.existing(bala);


/*
    Igual que el disparo del jugador:
    Arcade Physics controla directamente
    la velocidad del proyectil.
*/

bala.body.setVelocity(
Math.cos(angulo)*220,
Math.sin(angulo)*220
);


bala.dano=10;

proyectilesEnemigos.add(bala);


escenaPrincipal.time.delayedCall(
5000,
()=>{
if(bala.active)
bala.destroy();
}
);

}


/* =========================
   DAÑO PROYECTILES
========================= */

function impactoProyectilEnemigo(bala,enemigo){

if(!bala.active||!enemigo.active)
return;


let dano=bala.dano;

if(enemigo.tipo==="Vortice")
dano=bala.danoVortice;

if(enemigo.tipo==="Golem")
dano=bala.danoGolem;


enemigo.vida-=dano;

bala.destroy();


if(enemigo.vida<=0)
enemigo.destroy();


actualizarHUD();

}


function impactoProyectilEnemigoJugador(jugador,bala){

if(!bala.active)return;

bala.destroy();

if(invulnerable)return;

recibirDanio(bala.dano);

}


function contactoEnemigo(jugador,enemigo){

if(
!enemigo.active||
enemigo.tipo==="Vortice"||
invulnerable
)
return;


recibirDanio(
enemigo.tipo==="Golem"?20:10
);

}


/* =========================
   DAÑO JUGADOR
========================= */

function recibirDanio(dano){

if(invulnerable||jugadorMuerto)
return;

vidaJugador-=dano;

if(vidaJugador<0)
vidaJugador=0;

actualizarHUD();

invulnerable=true;

jugador.setAlpha(0.4);

escenaPrincipal.time.delayedCall(
500,
()=>{
invulnerable=false;
if(jugador.active)
jugador.setAlpha(1);
}
);

if(vidaJugador<=0)
matarJugador();

}


function matarJugador(){

jugadorMuerto=true;
juegoCongelado=true;

mostrarPantallaMuerte();

}


/* =========================
   RONDAS
========================= */

function iniciarRonda(escena){

generandoNuevaRonda=false;

let glifos=0;
let vortices=0;
let golems=0;


if(rondaActual===1)
glifos=5;

else if(rondaActual===2)
vortices=4;

else if(rondaActual===3){
glifos=6;
vortices=4;
}

else if(rondaActual===4)
golems=3;

else{

const aumento=rondaActual-5;

glifos=6+aumento*2;
vortices=4+aumento;
golems=2+Math.floor(aumento/2);

}


for(let i=0;i<glifos;i++)
crearEnemigo(escena,"Glifo");

for(let i=0;i<vortices;i++)
crearEnemigo(escena,"Vortice");

for(let i=0;i<golems;i++)
crearEnemigo(escena,"Golem");


actualizarHUD();

}


function comprobarFinRonda(){

if(
!partidaIniciada||
jugadorMuerto||
generandoNuevaRonda
)
return;


if(enemigos.countActive(true)===0){

generandoNuevaRonda=true;

escenaPrincipal.time.delayedCall(
1000,
()=>{

if(jugadorMuerto)return;

rondaActual++;

iniciarRonda(escenaPrincipal);

}
);

}

}


/* =========================
   RECARGA
========================= */

function iniciarRecargaMatematica(){

if(juegoCongelado||jugadorMuerto)
return;

juegoCongelado=true;

const preguntas=
BANCO_PREGUNTAS[
ARMAS[armaActual].dificultad
];

mostrarPregunta(
preguntas[0],
0,
preguntas
);

}


function mostrarPregunta(pregunta,indice,preguntas){

if(overlayActual)
overlayActual.destroy();


const escena=escenaPrincipal;

overlayActual=escena.add.container(
escena.scale.width/2,
escena.scale.height/2
);

overlayActual.setScrollFactor(0);
overlayActual.setDepth(500);


const fondo=escena.add.rectangle(
0,0,
Math.min(escena.scale.width*.85,650),
Math.min(escena.scale.height*.75,400),
0x11111a,.97
);


const titulo=escena.add.text(
0,-130,
"RECARGA MATEMÁTICA",
{
fontSize:"28px",
color:"#ffff00",
fontStyle:"bold"
}
);

titulo.setOrigin(.5);


const preguntaTexto=escena.add.text(
0,-65,
pregunta.pregunta,
{
fontSize:"20px",
color:"#ffffff",
align:"center",
wordWrap:{
width:Math.min(escena.scale.width*.72,560)
}
}
);

preguntaTexto.setOrigin(.5);


overlayActual.add(fondo);
overlayActual.add(titulo);
overlayActual.add(preguntaTexto);


const letras=["Z","X","C"];

pregunta.opciones.forEach((opcion,i)=>{

const texto=escena.add.text(
0,
30+i*55,
`${letras[i]}) ${opcion}`,
{
fontSize:"19px",
color:"#ffffff",
align:"center"
}
);

texto.setOrigin(.5);

overlayActual.add(texto);

});


escena.input.keyboard.once(
"keydown-Z",
()=>responderPregunta(0,pregunta,indice,preguntas)
);

escena.input.keyboard.once(
"keydown-X",
()=>responderPregunta(1,pregunta,indice,preguntas)
);

escena.input.keyboard.once(
"keydown-C",
()=>responderPregunta(2,pregunta,indice,preguntas)
);

redimensionarInterfaz();

}


function responderPregunta(
respuesta,
pregunta,
indice,
preguntas
){

if(!juegoCongelado)return;


if(respuesta===pregunta.correcta){

if(indice+1<preguntas.length){

mostrarPregunta(
preguntas[indice+1],
indice+1,
preguntas
);

}else{

municion=ARMAS[armaActual].maxMunicion;

juegoCongelado=false;

if(overlayActual){
overlayActual.destroy();
overlayActual=null;
}

actualizarHUD();

}

}else{

escenaPrincipal.cameras.main.flash(
150,255,0,0
);

}

}


/* =========================
   MENÚ
========================= */

function crearMenuPrincipal(escena){

menuPrincipal=escena.add.container(
escena.scale.width/2,
escena.scale.height/2
);

menuPrincipal.setScrollFactor(0);
menuPrincipal.setDepth(100);


const fondo=escena.add.rectangle(
0,0,10000,10000,
0x101018,.92
);

menuPrincipal.add(fondo);


const titulo=escena.add.text(
0,-150,
"CALABOZO DE LA CADENA",
{
fontSize:"42px",
color:"#ffffff",
fontStyle:"bold",
stroke:"#000000",
strokeThickness:7,
align:"center"
}
);

titulo.setOrigin(.5);

menuPrincipal.add(titulo);


menuPrincipal.add(
crearBoton(
escena,
"▶ JUGAR",
0,-40,
()=>{
menuPrincipal.setVisible(false);
iniciarPartida();
}
)
);


menuPrincipal.add(
crearBoton(
escena,
"🎮 CONTROLES",
0,40,
()=>{
menuPrincipal.setVisible(false);
mostrarControles(escena);
}
)
);


menuPrincipal.add(
crearBoton(
escena,
"📜 CRÉDITOS",
0,120,
()=>{
menuPrincipal.setVisible(false);
mostrarCreditos(escena);
}
)
);

}


function crearBoton(
escena,texto,x,y,callback
){

const boton=escena.add.container(x,y);

boton.setSize(300,60);

const fondo=escena.add.rectangle(
0,0,300,60,0x303044
);

const textoBoton=escena.add.text(
0,0,texto,
{
fontSize:"22px",
color:"#ffffff",
fontStyle:"bold"
}
);

textoBoton.setOrigin(.5);

boton.add(fondo);
boton.add(textoBoton);

boton.setInteractive(
new Phaser.Geom.Rectangle(
-150,-30,300,60
),
Phaser.Geom.Rectangle.Contains
);

boton.input.cursor="pointer";

boton.on("pointerover",()=>{
fondo.setFillStyle(0x4b4b6b);
});

boton.on("pointerout",()=>{
fondo.setFillStyle(0x303044);
});

boton.on("pointerdown",(
pointer,
localX,
localY,
event
)=>{

if(event)
event.stopPropagation();

callback();

});

boton.setScrollFactor(0);
boton.setDepth(101);

return boton;

}


/* =========================
   PARTIDA
========================= */

function iniciarPartida(){

partidaIniciada=true;
juegoCongelado=false;
jugadorMuerto=false;
invulnerable=false;

vidaJugador=vidaMaxima;
tiempoRestante=tiempoLimite;

rondaActual=1;
generandoNuevaRonda=false;

armaActual="PISTOLA";
municion=6;

jugador.setPosition(1200,1200);
jugador.setAlpha(1);

enemigos.clear(true,true);
proyectiles.clear(true,true);
proyectilesEnemigos.clear(true,true);

crearTextoControles();

iniciarRonda(escenaPrincipal);

actualizarHUD();

}


function crearTextoControles(){

if(escenaPrincipal.textoControles)
escenaPrincipal.textoControles.destroy();

escenaPrincipal.textoControles=
escenaPrincipal.add.text(
20,
escenaPrincipal.scale.height-20,
"WASD: Mover | Click: Disparar | 1/2/3: Cambiar arma",
{
fontSize:"16px",
color:"#ffffff",
stroke:"#000000",
strokeThickness:4
}
);

escenaPrincipal.textoControles.setScrollFactor(0);
escenaPrincipal.textoControles.setDepth(200);
escenaPrincipal.textoControles.setOrigin(0,1);

redimensionarInterfaz();

}

function crearOverlayInformativo(
escena,
tituloTexto,
lineas
){

if(overlayActual)
overlayActual.destroy();


overlayActual=escena.add.container(
escena.scale.width/2,
escena.scale.height/2
);

overlayActual.setScrollFactor(0);
overlayActual.setDepth(600);


const fondo=escena.add.rectangle(
0,0,
Math.min(escena.scale.width*.9,650),
Math.min(escena.scale.height*.85,500),
0x11111a,.98
);


const titulo=escena.add.text(
0,-180,
tituloTexto,
{
fontSize:"38px",
color:"#ffffff",
fontStyle:"bold",
stroke:"#000000",
strokeThickness:6
}
);

titulo.setOrigin(.5);


const contenido=escena.add.text(
0,-70,
lineas.join("\n"),
{
fontSize:"21px",
color:"#ffffff",
align:"center",
lineSpacing:8,
wordWrap:{
width:Math.min(escena.scale.width*.75,520)
}
}
);

contenido.setOrigin(.5);


overlayActual.add(fondo);
overlayActual.add(titulo);
overlayActual.add(contenido);


overlayActual.add(
crearBoton(
escena,
"← VOLVER",
0,170,
()=>{

overlayActual.destroy();
overlayActual=null;

menuPrincipal.setVisible(true);

redimensionarInterfaz();

}
)
);

redimensionarInterfaz();

}
