</head>

<body>

<div id="canvas-container"></div>

<script>

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'canvas-container',

    backgroundColor: '#1a1a24',

    physics: {
        default: 'arcade',
        arcade: {
            gravity: {
                y: 0
            },
            debug: false
        }
    },

    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);


// ==================================================
// VARIABLES
// ==================================================

let jugador;
let teclado;
let mouse;

let enemigos;
let balas;

let tiempoLimite = 900;

let textoUI;
let textoMatematicas;
let contenedorMatematicas;
let fondoMat;

let juegoCongelado = false;


// ==================================================
// ARMAS
// ==================================================

const ARMAS = {

    PISTOLA: {
        nombre: 'Pistola',
        balasMax: 6,
        dañoGlifo: 20,
        dañoVortice: 20,
        dañoGolem: 10,
        velocidadBala: 450,
        dif: 'Fácil'
    },

    RIFLE: {
        nombre: 'Rifle',
        balasMax: 15,
        dañoGlifo: 10,
        dañoVortice: 10,
        dañoGolem: 10,
        velocidadBala: 650,
        dif: 'Medio'
    },

    ESCOPETA: {
        nombre: 'Escopeta',
        balasMax: 2,
        dañoGlifo: 76,
        dañoVortice: 76,
        dañoGolem: 76,
        velocidadBala: 350,
        dif: 'Difícil'
    }
};

let armaActual = ARMAS.PISTOLA;
let balasActuales = armaActual.balasMax;


// ==================================================
// BANCO DE PREGUNTAS
// ==================================================

const BANCO_PREGUNTAS = {

    'Fácil': [

        {
            f: 'y = (3x - 1)⁵',

            p1: {
                q: 'Deriva la potencia externa:',

                opciones: [
                    'Z) 5(3x-1)⁴',
                    'X) 5(3x-1)⁵',
                    'C) (3x-1)⁴'
                ],

                correcta: 0
            },

            p2: {
                q: 'Deriva lo interno (3x-1):',

                opciones: [
                    'Z) 3x',
                    'X) 3',
                    'C) 1'
                ],

                correcta: 1
            }
        }
    ],


    'Medio': [

        {
            f: 'y = cos(x³)',

            p1: {
                q: 'Deriva la trigonométrica externa:',

                opciones: [
                    'Z) sin(x³)',
                    'X) -sin(x³)',
                    'C) -cos(x³)'
                ],

                correcta: 1
            },

            p2: {
                q: 'Deriva lo interno (x³):',

                opciones: [
                    'Z) 3x²',
                    'X) 3x',
                    'C) x²'
                ],

                correcta: 0
            }
        }
    ],


    'Difícil': [

        {
            f: 'y = ln(sin(x))',

            p1: {
                q: 'Deriva el logaritmo externo:',

                opciones: [
                    'Z) 1/x',
                    'X) 1/sin(x)',
                    'C) cos(x)'
                ],

                correcta: 1
            },

            p2: {
                q: 'Deriva lo interno (sin(x)):',

                opciones: [
                    'Z) cos(x)',
                    'X) -cos(x)',
                    'C) 1/cos(x)'
                ],

                correcta: 0
            }
        }
    ]
};


let preguntaActual = null;
let pasoActual = 1;


// ==================================================
// PRELOAD
// ==================================================

function preload() {

}


// ==================================================
// CREATE
// ==================================================

function create() {

    this.physics.world.setBounds(
        0,
        0,
        2400,
        2400
    );


    // ==================================================
    // REJILLA
    // ==================================================

    let graphics = this.add.graphics();

    graphics.lineStyle(
        1,
        0x333344,
        1
    );

    for (
        let x = 0;
        x < 2400;
        x += 80
    ) {

        graphics.moveTo(x, 0);
        graphics.lineTo(x, 2400);
    }

    for (
        let y = 0;
        y < 2400;
        y += 80
    ) {

        graphics.moveTo(0, y);
        graphics.lineTo(2400, y);
    }

    graphics.strokePath();


    // ==================================================
    // JUGADOR
    // ==================================================

    jugador = this.add.rectangle(
        1200,
        1200,
        32,
        32,
        0x00ff00
    );

    this.physics.add.existing(jugador);

    jugador.body.setCollideWorldBounds(true);


    // ==================================================
    // CÁMARA
    // ==================================================

    this.cameras.main.setBounds(
        0,
        0,
        2400,
        2400
    );

    this.cameras.main.startFollow(
        jugador
    );


    // ==================================================
    // GRUPOS
    // ==================================================

    enemigos = this.physics.add.group();

    balas = this.physics.add.group();


    // ==================================================
    // CONTROLES
    // ==================================================

    teclado = this.input.keyboard.addKeys({

        ARRIBA: Phaser.Input.Keyboard.KeyCodes.W,
        ABAJO: Phaser.Input.Keyboard.KeyCodes.S,
        IZQUIERDA: Phaser.Input.Keyboard.KeyCodes.A,
        DERECHA: Phaser.Input.Keyboard.KeyCodes.D,

        UNO: Phaser.Input.Keyboard.KeyCodes.ONE,
        DOS: Phaser.Input.Keyboard.KeyCodes.TWO,
        TRES: Phaser.Input.Keyboard.KeyCodes.THREE,

        Z: Phaser.Input.Keyboard.KeyCodes.Z,
        X: Phaser.Input.Keyboard.KeyCodes.X,
        C: Phaser.Input.Keyboard.KeyCodes.C
    });


    mouse = this.input.activePointer;


    // ==================================================
    // ENEMIGOS
    // ==================================================

    generarEnemigos(this);


    this.physics.add.overlap(
        balas,
        enemigos,
        impactarEnemigo,
        null,
        this
    );


    // ==================================================
    // UI
    // ==================================================

    textoUI = this.add.text(
        20,
        20,
        '',
        {
            fontSize: '18px',
            fill: '#ffffff',
            fontStyle: 'bold'
        }
    ).setScrollFactor(0);

    actualizarUI();


    // ==================================================
    // MÓDULO MATEMÁTICO
    // ==================================================

    contenedorMatematicas =
        this.add.container(
            400,
            480
        ).setScrollFactor(0);


    fondoMat = this.add.rectangle(
        0,
        0,
        720,
        200,
        0x0b0b14,
        0.95
    );


    fondoMat.setStrokeStyle(
        3,
        0xffaa00
    );


    textoMatematicas = this.add.text(
        -340,
        -80,
        '',
        {
            fontSize: '15px',
            fill: '#ffffff',
            fontStyle: 'bold',
            lineSpacing: 8,
            wordWrap: {
                width: 680
            }
        }
    );


    contenedorMatematicas.add([
        fondoMat,
        textoMatematicas
    ]);


    contenedorMatematicas.setVisible(false);


    // ==================================================
    // TEMPORIZADOR
    // ==================================================

    this.time.addEvent({

        delay: 1000,

        callback: () => {

            // EL TIEMPO CONTINÚA INCLUSO CUANDO
            // EL JUGADOR ESTÁ CONGELADO

            if (tiempoLimite > 0) {

                tiempoLimite--;

            }

            actualizarUI();

        },

        loop: true
    });


    // ==================================================
    // DISPARAR
    // ==================================================

    this.input.on(
        'pointerdown',
        () => {

            disparar(this);

        }
    );
}


// ==================================================
// UPDATE
// ==================================================

function update() {

    if (juegoCongelado) {

        manejarRecarga();

        jugador.body.setVelocity(0);

        enemigos.getChildren().forEach(
            enemigo => {

                enemigo.body.setVelocity(0);

            }
        );

        return;
    }


    // ==================================================
    // CAMBIO DE ARMAS
    // ==================================================

    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.UNO
        )
    ) {

        cambiarArma(
            ARMAS.PISTOLA
        );
    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.DOS
        )
    ) {

        cambiarArma(
            ARMAS.RIFLE
        );
    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.TRES
        )
    ) {

        cambiarArma(
            ARMAS.ESCOPETA
        );
    }


    // ==================================================
    // MOVIMIENTO WASD
    // ==================================================

    jugador.body.setVelocity(0);

    let velocidad = 300;


    if (teclado.IZQUIERDA.isDown) {

        jugador.body.setVelocityX(-velocidad);

    } else if (teclado.DERECHA.isDown) {

        jugador.body.setVelocityX(velocidad);

    }


    if (teclado.ARRIBA.isDown) {

        jugador.body.setVelocityY(-velocidad);

    } else if (teclado.ABAJO.isDown) {

        jugador.body.setVelocityY(velocidad);

    }


    // ==================================================
    // MOVIMIENTO ENEMIGOS
    // ==================================================

    enemigos.getChildren().forEach(
        enemigo => {

            if (
                enemigo.tipo === 'Glifo'
            ) {

                this.physics.moveToObject(
                    enemigo,
                    jugador,
                    160
                );

            } else if (
                enemigo.tipo === 'Golem'
            ) {

                this.physics.moveToObject(
                    enemigo,
                    jugador,
                    50
                );

            } else if (
                enemigo.tipo === 'Vortice'
            ) {

                let distancia =
                    Phaser.Math.Distance.Between(
                        enemigo.x,
                        enemigo.y,
                        jugador.x,
                        jugador.y
                    );


                if (distancia > 350) {

                    this.physics.moveToObject(
                        enemigo,
                        jugador,
                        80
                    );

                } else {

                    enemigo.body.setVelocity(0);

                }
            }
        }
    );
}


// ==================================================
// GENERAR ENEMIGOS
// ==================================================

function generarEnemigos(escena) {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        crearEnemigo(
            escena,
            'Glifo',
            0x00ffff,
            20
        );
    }


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        crearEnemigo(
            escena,
            'Vortice',
            0xff00ff,
            20
        );
    }


    for (
        let i = 0;
        i < 10;
        i++
    ) {

        crearEnemigo(
            escena,
            'Golem',
            0xff5500,
            150
        );
    }
}


// ==================================================
// CREAR ENEMIGO
// ==================================================

function crearEnemigo(
    escena,
    tipo,
    color,
    hp
) {

    let x =
        Phaser.Math.Between(
            100,
            2300
        );

    let y =
        Phaser.Math.Between(
            100,
            2300
        );


    if (
        Phaser.Math.Distance.Between(
            x,
            y,
            1200,
            1200
        ) < 300
    ) {

        x += 500;
        y += 500;
    }


    let tamaño =
        tipo === 'Golem'
            ? 48
            : 24;


    let enemigo =
        escena.add.rectangle(
            x,
            y,
            tamaño,
            tamaño,
            color
        );


    escena.physics.add.existing(
        enemigo
    );


    enemigo.tipo = tipo;
    enemigo.hp = hp;


    enemigos.add(enemigo);
}


// ==================================================
// DISPARAR
// ==================================================

function disparar(escena) {

    if (juegoCongelado) {

        return;

    }


    if (balasActuales <= 0) {

        iniciarRecarga();

        return;
    }


    balasActuales--;

    actualizarUI();


    let bala =
        escena.add.circle(
            jugador.x,
            jugador.y,
            6,
            0xffff00
        );


    escena.physics.add.existing(
        bala
    );


    balas.add(bala);


    let angulo =
        Phaser.Math.Angle.Between(
            jugador.x,
            jugador.y,
            escena.cameras.main.scrollX +
                mouse.x,
            escena.cameras.main.scrollY +
                mouse.y
        );


    escena.physics.velocityFromRotation(
        angulo,
        armaActual.velocidadBala,
        bala.body.velocity
    );
}


// ==================================================
// IMPACTO ENEMIGO
// ==================================================

function impactarEnemigo(
    bala,
    enemigo
) {

    bala.destroy();


    let daño = 0;


    if (
        enemigo.tipo === 'Glifo'
    ) {

        daño = armaActual.dañoGlifo;

    }


    if (
        enemigo.tipo === 'Vortice'
    ) {

        daño = armaActual.dañoVortice;

    }


    if (
        enemigo.tipo === 'Golem'
    ) {

        daño = armaActual.dañoGolem;

    }


    enemigo.hp -= daño;


    if (
        enemigo.hp <= 0
    ) {

        enemigo.destroy();

    }
}


// ==================================================
// CAMBIAR ARMA
// ==================================================

function cambiarArma(
    nuevaArma
) {

    armaActual = nuevaArma;

    balasActuales =
        armaActual.balasMax;

    actualizarUI();
}


// ==================================================
// ACTUALIZAR UI
// ==================================================

function actualizarUI() {

    let minutos =
        Math.floor(
            tiempoLimite / 60
        );


    let segundos =
        tiempoLimite % 60;


    segundos =
        segundos < 10
            ? '0' + segundos
            : segundos;


    textoUI.setText(

        `⏱️ TIEMPO RESTANTE: ${minutos}:${segundos}\n` +

        `💥 ARMA EQUIPADA: ${armaActual.nombre.toUpperCase()} (Dificultad: ${armaActual.dif})\n` +

        `⚡ MUNICIÓN: ${balasActuales} / ${armaActual.balasMax}\n\n` +

        `[Movimiento]: W A S D\n` +

        `[Disparo]: Click izquierdo\n` +

        `[Armas]: 1 Pistola | 2 Rifle | 3 Escopeta`

    );
}


// ==================================================
// INICIAR RECARGA
// ==================================================

function iniciarRecarga() {

    juegoCongelado = true;

    pasoActual = 1;


    let lista =
        BANCO_PREGUNTAS[
            armaActual.dif
        ];


    preguntaActual =
        lista[
            Phaser.Math.Between(
                0,
                lista.length - 1
            )
        ];


    contenedorMatematicas.setVisible(
        true
    );


    mostrarPaso();
}


// ==================================================
// MOSTRAR PREGUNTA
// ==================================================

function mostrarPaso() {

    let paso =
        pasoActual === 1
            ? preguntaActual.p1
            : preguntaActual.p2;


    textoMatematicas.setText(

        `⚠️ MÓDULO DE DERIVACIÓN REQUERIDO (REGLA DE LA CADENA)\n\n` +

        `Función actual: ${preguntaActual.f}\n\n` +

        `PASO ${pasoActual}: ${paso.q}\n\n` +

        `Presiona la tecla correspondiente:\n\n` +

        `👉 ${paso.opciones[0]}    👉 ${paso.opciones[1]}    👉 ${paso.opciones[2]}\n\n` +

        `Z = primera opción     X = segunda opción     C = tercera opción`

    );
}


// ==================================================
// MANEJAR RECARGA
// ==================================================

function manejarRecarga() {

    let paso =
        pasoActual === 1
            ? preguntaActual.p1
            : preguntaActual.p2;


    let seleccion = -1;


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.Z
        )
    ) {

        seleccion = 0;

    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.X
        )
    ) {

        seleccion = 1;

    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.C
        )
    ) {

        seleccion = 2;

    }


    if (
        seleccion !== -1
    ) {

        if (
            seleccion === paso.correcta
        ) {

            if (
                pasoActual === 1
            ) {

                pasoActual = 2;

                mostrarPaso();

            } else {

                balasActuales =
                    armaActual.balasMax;

                juegoCongelado = false;

                contenedorMatematicas.setVisible(
                    false
                );

                actualizarUI();
            }

        } else {

            fondoMat.setStrokeStyle(
                3,
                0xff0000
            );


            setTimeout(() => {

                fondoMat.setStrokeStyle(
                    3,
                    0xffaa00
                );

            }, 300);
        }
    }
}

</script>

</body>
</html>
