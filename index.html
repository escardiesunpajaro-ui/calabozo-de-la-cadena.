const config = {
    type:Phaser.AUTO,

    width:800,
    height:600,

    backgroundColor:"#151515",

    physics:{
        default:"arcade",
        arcade:{
            gravity:{y:0},
            debug:false
        }
    },

    scale:{
        mode:Phaser.Scale.RESIZE,
        autoCenter:Phaser.Scale.CENTER_BOTH
    },

    scene:{
        preload:function(){},

        create:function(){
            escenaPrincipal=this;

            this.cameras.main.setBounds(0,0,2400,2400);
            this.physics.world.setBounds(0,0,2400,2400);

            crearMundo(this);
            crearMenuPrincipal(this);

            this.input.setTopOnly(true);

            this.scale.on("resize",function(){
                redimensionarInterfaz();
            });
        },

        update:function(){
            if(!partidaIniciada){
                return;
            }

            if(jugadorMuerto){
                return;
            }

            if(juegoCongelado){

                if(jugador && jugador.body){
                    jugador.body.setVelocity(0);
                }

                enemigos.children.iterate(function(enemigo){
                    if(enemigo && enemigo.body){
                        enemigo.body.setVelocity(0,0);
                    }
                });

                proyectiles.children.iterate(function(bala){
                    if(bala && bala.body){
                        bala.body.setVelocity(0,0);
                    }
                });

                proyectilesEnemigos.children.iterate(function(bala){
                    if(bala && bala.body){
                        bala.body.setVelocity(0,0);
                    }
                });

                return;
            }

            controlarJugador();

            enemigos.children.iterate(function(enemigo){

                if(!enemigo || !enemigo.active){
                    return;
                }

                if(enemigo.tipo === "Glifo"){

                    const angulo = Phaser.Math.Angle.Between(
                        enemigo.x,
                        enemigo.y,
                        jugador.x,
                        jugador.y
                    );

                    enemigo.body.setVelocity(
                        Math.cos(angulo)*160,
                        Math.sin(angulo)*160
                    );
                }

                else if(enemigo.tipo === "Vortice"){

                    const distancia = Phaser.Math.Distance.Between(
                        enemigo.x,
                        enemigo.y,
                        jugador.x,
                        jugador.y
                    );

                    if(distancia > 350){

                        const angulo = Phaser.Math.Angle.Between(
                            enemigo.x,
                            enemigo.y,
                            jugador.x,
                            jugador.y
                        );

                        enemigo.body.setVelocity(
                            Math.cos(angulo)*80,
                            Math.sin(angulo)*80
                        );

                    }else{

                        enemigo.body.setVelocity(0,0);
                    }
                }

                else if(enemigo.tipo === "Golem"){

                    const angulo = Phaser.Math.Angle.Between(
                        enemigo.x,
                        enemigo.y,
                        jugador.x,
                        jugador.y
                    );

                    enemigo.body.setVelocity(
                        Math.cos(angulo)*50,
                        Math.sin(angulo)*50
                    );
                }
            });
        }
    }
};

const juego = new Phaser.Game(config);


function crearMundo(scene){

    const grafico = scene.add.graphics();

    grafico.lineStyle(1,0x292929,1);

    for(let x=0;x<=2400;x+=80){
        grafico.lineBetween(x,0,x,2400);
    }

    for(let y=0;y<=2400;y+=80){
        grafico.lineBetween(0,y,2400,y);
    }

    grafico.lineStyle(4,0x555555,1);
    grafico.strokeRect(0,0,2400,2400);

    jugador = scene.add.rectangle(
        1200,
        1200,
        32,
        32,
        0x00ff00
    );

    scene.physics.add.existing(jugador);

    jugador.body.setCollideWorldBounds(true);

    enemigos = scene.physics.add.group();
    proyectiles = scene.physics.add.group();
    proyectilesEnemigos = scene.physics.add.group();

    scene.cameras.main.startFollow(
        jugador,
        true,
        0.08,
        0.08
    );

    scene.physics.add.overlap(
        jugador,
        enemigos,
        recibirDanioContacto,
        null,
        scene
    );

    scene.physics.add.overlap(
        jugador,
        proyectilesEnemigos,
        recibirDanioProyectil,
        null,
        scene
    );

    scene.physics.add.overlap(
        proyectiles,
        enemigos,
        impactoProyectil,
        null,
        scene
    );
}

function crearBotonMenu(scene,x,y,texto,accion){

    const contenedor = scene.add.container(x,y);

    const fondo = scene.add.rectangle(
        0,
        0,
        300,
        60,
        0x252525
    );

    fondo.setStrokeStyle(
        2,
        0x777777,
        1
    );

    const textoBoton = scene.add.text(
        0,
        0,
        texto,
        {
            fontFamily:"Arial",
            fontSize:"20px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    ).setOrigin(0.5);

    contenedor.add([
        fondo,
        textoBoton
    ]);

    contenedor.setSize(300,60);

    contenedor.setInteractive(
        new Phaser.Geom.Rectangle(
            -150,
            -30,
            300,
            60
        ),
        Phaser.Geom.Rectangle.Contains
    );

    contenedor.input.cursor = "pointer";

    contenedor.on("pointerover",function(){
        fondo.setFillStyle(0x3b3b3b);
        fondo.setStrokeStyle(2,0xffffff,1);
    });

    contenedor.on("pointerout",function(){
        fondo.setFillStyle(0x252525);
        fondo.setStrokeStyle(2,0x777777,1);
    });

    contenedor.on("pointerdown",function(pointer){
        pointer.event.stopPropagation();
        accion();
    });

    return contenedor;
}


function iniciarPartida(){

    if(menuPrincipal){
        menuPrincipal.setVisible(false);
    }

    partidaIniciada=true;
    juegoCongelado=false;
    jugadorMuerto=false;

    vidaJugador=100;
    tiempoRestante=900;

    rondaActual=0;

    armaActual=0;
    municionActual=ARMAS[armaActual].maxMunicion;

    enemigos.clear(true,true);
    proyectiles.clear(true,true);
    proyectilesEnemigos.clear(true,true);

    jugador.setPosition(1200,1200);
    jugador.setAlpha(1);

    crearHUD();

    iniciarRonda();

    temporizadorTiempo = escenaPrincipal.time.addEvent({
        delay:1000,
        loop:true,
        callback:function(){

            if(
                partidaIniciada &&
                !jugadorMuerto &&
                tiempoRestante > 0
            ){
                tiempoRestante--;

                actualizarHUD();

                if(tiempoRestante <= 0){
                    mostrarDerrotaTiempo();
                }
            }
        }
    });

    actualizarHUD();
}

function actualizarHUD(){

    if(!textoVida){
        return;
    }

    textoVida.setText(
        "❤️ VIDA: " +
        Math.max(0,vidaJugador) +
        "/" +
        vidaMaxima
    );

    textoTiempo.setText(
        "⏱️ TIEMPO RESTANTE: " +
        formatearTiempo(tiempoRestante)
    );

    textoArma.setText(
        "💥 ARMA: " +
        ARMAS[armaActual].nombre +
        " (" +
        ARMAS[armaActual].dificultad +
        ")"
    );

    textoMunicion.setText(
        "⚡ MUNICIÓN: " +
        municionActual +
        "/" +
        ARMAS[armaActual].maxMunicion
    );

    textoEnemigos.setText(
        "👾 ENEMIGOS RESTANTES: " +
        enemigos.countActive(true)
    );

    textoRonda.setText(
        "RONDA " +
        rondaActual
    );
}


function formatearTiempo(segundos){

    const minutos = Math.floor(segundos/60);
    const segundosRestantes = segundos % 60;

    return (
        String(minutos).padStart(2,"0") +
        ":" +
        String(segundosRestantes).padStart(2,"0")
    );
}


function controlarJugador(){

    if(!jugador || !jugador.body){
        return;
    }

    const velocidad=220;

    let vx=0;
    let vy=0;

    const teclado=escenaPrincipal.input.keyboard;

    if(
        teclado.addKey("W").isDown ||
        teclado.addKey("UP").isDown
    ){
        vy=-velocidad;
    }

    if(
        teclado.addKey("S").isDown ||
        teclado.addKey("DOWN").isDown
    ){
        vy=velocidad;
    }

    if(
        teclado.addKey("A").isDown ||
        teclado.addKey("LEFT").isDown
    ){
        vx=-velocidad;
    }

    if(
        teclado.addKey("D").isDown ||
        teclado.addKey("RIGHT").isDown
    ){
        vx=velocidad;
    }

    if(vx !== 0 && vy !== 0){

        const factor=1/Math.sqrt(2);

        vx*=factor;
        vy*=factor;
    }

    jugador.body.setVelocity(vx,vy);
}


function disparar(pointer){

    if(
        !partidaIniciada ||
        jugadorMuerto ||
        juegoCongelado
    ){
        return;
    }

    if(municionActual <= 0){
        iniciarRecargaMatematica();
        return;
    }

    const puntoMundo =
        escenaPrincipal.cameras.main.getWorldPoint(
            pointer.x,
            pointer.y
        );

    const angulo =
        Phaser.Math.Angle.Between(
            jugador.x,
            jugador.y,
            puntoMundo.x,
            puntoMundo.y
        );

    const bala = escenaPrincipal.add.circle(
        jugador.x,
        jugador.y,
        7,
        0xffff00
    );

    escenaPrincipal.physics.add.existing(bala);

    bala.dano = obtenerDanioArma();

    proyectiles.add(bala);

    bala.body.setVelocity(
        Math.cos(angulo) * ARMAS[armaActual].velocidad,
        Math.sin(angulo) * ARMAS[armaActual].velocidad
    );

    municionActual--;

    actualizarHUD();

    escenaPrincipal.time.delayedCall(
        5000,
        function(){
            if(bala && bala.active){
                bala.destroy();
            }
        }
    );

    if(municionActual <= 0){
        iniciarRecargaMatematica();
    }
}


escenaPrincipal.input.on(
    "pointerdown",
    function(pointer){
        if(pointer.leftButtonDown()){
            disparar(pointer);
        }
    }
);


function obtenerDanioArma(){

    const arma=ARMAS[armaActual];

    return {
        Glifo:arma.danoGlifo,
        Vortice:arma.danoVortice,
        Golem:arma.danoGolem
    };
}


function cambiarArma(indice){

    if(
        !partidaIniciada ||
        jugadorMuerto ||
        juegoCongelado
    ){
        return;
    }

    armaActual=indice;

    municionActual=
        ARMAS[armaActual].maxMunicion;

    actualizarHUD();
}


escenaPrincipal.input.keyboard.on(
    "keydown-ONE",
    function(){
        cambiarArma(0);
    }
);

escenaPrincipal.input.keyboard.on(
    "keydown-TWO",
    function(){
        cambiarArma(1);
    }
);

escenaPrincipal.input.keyboard.on(
    "keydown-THREE",
    function(){
        cambiarArma(2);
    }
);


function iniciarRonda(){

    rondaActual++;

    const posiciones = [];

    let cantidadGlifos=0;
    let cantidadVortices=0;
    let cantidadGolems=0;

    if(rondaActual===1){

        cantidadGlifos=5;

    }else if(rondaActual===2){

        cantidadVortices=4;

    }else if(rondaActual===3){

        cantidadGlifos=6;
        cantidadVortices=4;

    }else if(rondaActual===4){

        cantidadGolems=3;

    }else{

        const aumento=rondaActual-5;

        cantidadGlifos=6+(aumento*2);
        cantidadVortices=4+aumento;
        cantidadGolems=
            2+Math.floor(aumento/2);
    }

    for(let i=0;i<cantidadGlifos;i++){
        crearEnemigo("Glifo");
    }

    for(let i=0;i<cantidadVortices;i++){
        crearEnemigo("Vortice");
    }

    for(let i=0;i<cantidadGolems;i++){
        crearEnemigo("Golem");
    }

    actualizarHUD();
}


function crearEnemigo(tipo){

    let x;
    let y;

    do{

        x=Phaser.Math.Between(100,2300);
        y=Phaser.Math.Between(100,2300);

    }while(
        Phaser.Math.Distance.Between(
            x,
            y,
            jugador.x,
            jugador.y
        ) < 400
    );

    let enemigo;

    if(tipo==="Glifo"){

        enemigo=escenaPrincipal.add.rectangle(
            x,
            y,
            32,
            32,
            0x00ffff
        );

        enemigo.vida=20;
        enemigo.tipo="Glifo";
        enemigo.danoContacto=10;
    }

    else if(tipo==="Vortice"){

        enemigo=escenaPrincipal.add.circle(
            x,
            y,
            24,
            0xff00ff
        );

        enemigo.vida=20;
        enemigo.tipo="Vortice";
        enemigo.danoContacto=0;

        enemigo.ultimoDisparo=0;
    }

    else if(tipo==="Golem"){

        enemigo=escenaPrincipal.add.rectangle(
            x,
            y,
            48,
            48,
            0xff8800
        );

        enemigo.vida=150;
        enemigo.tipo="Golem";
        enemigo.danoContacto=20;
    }

    escenaPrincipal.physics.add.existing(enemigo);

    enemigo.body.setCollideWorldBounds(true);

    enemigos.add(enemigo);

    if(tipo==="Vortice"){

        temporizadorVortices =
            escenaPrincipal.time.addEvent({
                delay:2000,
                loop:true,
                callback:function(){

                    if(
                        !enemigo.active ||
                        !partidaIniciada ||
                        jugadorMuerto ||
                        juegoCongelado
                    ){
                        return;
                    }

                    const distancia =
                        Phaser.Math.Distance.Between(
                            enemigo.x,
                            enemigo.y,
                            jugador.x,
                            jugador.y
                        );

                    if(distancia <= 600){
                        disparoVortice(enemigo);
                    }
                }
            });
    }
}


function disparoVortice(enemigo){

    if(!enemigo || !enemigo.active){
        return;
    }

    const angulo =
        Phaser.Math.Angle.Between(
            enemigo.x,
            enemigo.y,
            jugador.x,
            jugador.y
        );

    const bala=escenaPrincipal.add.circle(
        enemigo.x,
        enemigo.y,
        8,
        0xff00ff
    );

    escenaPrincipal.physics.add.existing(bala);

    bala.dano=10;

    proyectilesEnemigos.add(bala);

    bala.body.setVelocity(
        Math.cos(angulo)*220,
        Math.sin(angulo)*220
    );

    escenaPrincipal.time.delayedCall(
        5000,
        function(){
            if(bala && bala.active){
                bala.destroy();
            }
        }
    );
}


function recibirDanioContacto(jugadorActual,enemigo){

    if(
        jugadorMuerto ||
        jugadorInvulnerable ||
        juegoCongelado
    ){
        return;
    }

    if(!enemigo.active){
        return;
    }

    const dano=enemigo.danoContacto || 0;

    if(dano<=0){
        return;
    }

    recibirDanio(dano);
}


function recibirDanioProyectil(jugadorActual,bala){

    if(!bala || !bala.active){
        return;
    }

    const dano=bala.dano || 10;

    bala.destroy();

    if(
        jugadorMuerto ||
        juegoCongelado
    ){
        return;
    }

    if(jugadorInvulnerable){
        return;
    }

    recibirDanio(dano);
}


function recibirDanio(dano){

    if(
        jugadorMuerto ||
        jugadorInvulnerable
    ){
        return;
    }

    vidaJugador-=dano;

    actualizarHUD();

    if(vidaJugador<=0){

        vidaJugador=0;

        actualizarHUD();

        jugadorMuerto=true;
        juegoCongelado=true;

        jugador.body.setVelocity(0);

        mostrarMuerte();

        return;
    }

    jugadorInvulnerable=true;
    jugador.setAlpha(0.4);

    escenaPrincipal.time.delayedCall(
        500,
        function(){

            jugadorInvulnerable=false;

            if(jugador && jugador.active){
                jugador.setAlpha(1);
            }
        }
    );
}


function impactoProyectil(bala,enemigo){

    if(
        !bala ||
        !bala.active ||
        !enemigo ||
        !enemigo.active
    ){
        return;
    }

    bala.destroy();

    let dano=0;

    if(enemigo.tipo==="Glifo"){
        dano=ARMAS[armaActual].danoGlifo;
    }

    else if(enemigo.tipo==="Vortice"){
        dano=ARMAS[armaActual].danoVortice;
    }

    else if(enemigo.tipo==="Golem"){
        dano=ARMAS[armaActual].danoGolem;
    }

    enemigo.vida-=dano;

    if(enemigo.vida<=0){

        if(enemigo.tipo==="Vortice"){
            // El temporizador asociado deja de disparar
            // porque el enemigo queda inactivo.
        }

        enemigo.destroy();

        comprobarFinRonda();
    }
}


function comprobarFinRonda(){

    if(
        enemigos.countActive(true)===0 &&
        partidaIniciada &&
        !jugadorMuerto
    ){

        escenaPrincipal.time.delayedCall(
            1000,
            function(){

                if(
                    partidaIniciada &&
                    !jugadorMuerto &&
                    enemigos.countActive(true)===0
                ){
                    iniciarRonda();
                }
            }
        );
    }

    actualizarHUD();
}


function iniciarRecargaMatematica(){

    if(
        juegoCongelado ||
        jugadorMuerto
    ){
        return;
    }

    juegoCongelado=true;

    jugador.body.setVelocity(0);

    mostrarPregunta();
}

    let indice=0;

    const preguntaActual=preguntas[indice];

    const overlay=escenaPrincipal.add.container(
        escenaPrincipal.scale.width/2,
        escenaPrincipal.scale.height/2

    overlayActual=overlay;

    const fondo=escenaPrincipal.add.rectangle(

        700,
        500,

        0.98
    );

    fondo.setStrokeStyle(
        4,
        0xffffff,
        1
    );

    const titulo=escenaPrincipal.add.text(
        0,
        -205,
        "RECARGA MATEMÁTICA",
        {
            fontFamily:"Arial",
            fontSize:"30px",
            fontStyle:"bold",
            color:"#ffffff"
        }
    ).setOrigin(0.5);

    const funcion=escenaPrincipal.add.text(
        0,
        -160,
        banco.funcion,
        {
            fontFamily:"Arial",
            fontSize:"24px",
            color:"#00ffff"
        }
    ).setOrigin(0.5);

    const preguntaTexto=escenaPrincipal.add.text(
        -300,
        -105,
        "",
        {
            fontFamily:"Arial",
            fontSize:"20px",
            color:"#ffffff",
            wordWrap:{

    );

    const opcionesTexto=escenaPrincipal.add.text(
        -300,
        -40,
        "",
        {
            fontFamily:"Arial",
            fontSize:"20px",
            color:"#ffffff",
            lineSpacing:12,
            wordWrap:{
                width:600
            }
        }
    );

    const mensaje=escenaPrincipal.add.text(
        0,
        175,
        "Presiona Z, X o C para responder",
        {
            fontFamily:"Arial",
            fontSize:"18px",
            color:"#aaaaaa"
        }
    ).setOrigin(0.5);

    overlay.add([
        fondo,
        titulo,
        funcion,
        preguntaTexto,
        opcionesTexto,
        mensaje
    ]);

    overlay.setDepth(2000);

    function actualizarPregunta(){

        const pregunta=preguntas[indice];

        preguntaTexto.setText(
            (indice+1)+". "+
            pregunta.texto
        );

        opcionesTexto.setText(
            "Z) "+pregunta.opciones[0]+
            "\nX) "+pregunta.opciones[1]+
            "\nC) "+pregunta.opciones[2]+
            "\n\nDificultad: "+dificultad
        );
    }

    function responderPregunta(
        respuesta,
        pregunta,
        indicePregunta
    ){

        if(
            !overlayActual ||
            !overlayActual.active
        ){
            return;
        }

        if(
            respuesta===
            pregunta.correcta
        ){

            indice++;

            if(indice>=preguntas.length){

                overlay.destroy();

                if(overlayActual===overlay){
                    overlayActual=null;
                }

                juegoCongelado=false;

                municionActual=
                    ARMAS[armaActual].maxMunicion;

                actualizarHUD();

                return;
            }

            actualizarPregunta();

        }else{

            fondo.setFillStyle(
                0x660000,
                0.98
            );

            escenaPrincipal.time.delayedCall(
                180,
                function(){

                    if(
                        fondo &&
                        fondo.active
                    ){
                        fondo.setFillStyle(
                            0x111111,
                            0.98
                        );
                    }
                }
            );
        }
    }

    escenaPrincipal.input.keyboard.once(
        "keydown-Z",
        function(){
            responderPregunta(
                0,
                preguntas[indice],
                indice
            );
        }
    );

    escenaPrincipal.input.keyboard.once(
        "keydown-X",
        function(){
            responderPregunta(
                1,
                preguntas[indice],
                indice
            );
        }
    );

    escenaPrincipal.input.keyboard.once(
        "keydown-C",
        function(){
            responderPregunta(
                2,
                preguntas[indice],
                indice
            );
        }
    );

    actualizarPregunta();

    redimensionarInterfaz();
}

function redimensionarInterfaz(){

    if(!escenaPrincipal){
        return;
    }

    const ancho=escenaPrincipal.scale.width;
    const alto=escenaPrincipal.scale.height;

    const escala=Math.max(
        0.75,
        Math.min(
            1.35,
            Math.min(
                ancho/800,
                alto/600
            )
        )
    );

    if(menuPrincipal){

        menuPrincipal.setPosition(
            ancho/2,
            alto/2
        );

        menuPrincipal.setScale(escala);
    }

    if(overlayActual){

        overlayActual.setPosition(
            ancho/2,
            alto/2
        );

        overlayActual.setScale(escala);
    }

    if(textoVida){

        const escalaHUD=Math.max(
            0.75,
            Math.min(1.25,escala)
        );

        textoVida.setPosition(
            20,
            20
        );

        textoTiempo.setPosition(
            20,
            50
        );

        textoArma.setPosition(
            20,
            80
        );

        textoMunicion.setPosition(
            20,
            110
        );

        textoEnemigos.setPosition(
            20,
            140
        );

        textoRonda.setPosition(
            ancho-20,
            20
        );

        textoControles.setPosition(
            20,
            alto-20
        );

        textoVida.setScale(escalaHUD);
        textoTiempo.setScale(escalaHUD);
        textoArma.setScale(escalaHUD);
        textoMunicion.setScale(escalaHUD);
        textoEnemigos.setScale(escalaHUD);
        textoRonda.setScale(escalaHUD);
        textoControles.setScale(escalaHUD);
    }
}
