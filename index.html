<body>

<div id="canvas-container"></div>

<script>

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    parent: 'canvas-container',

    backgroundColor: '#1a1a24',

    physics: {
        default: 'arcade',
        arcade: {
            gravity: {
                y: 0
            },
            debug: false
        }
    },

    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);


// ==================================================
// VARIABLES
// ==================================================

let jugador;
let teclado;
let mouse;
let escenaJuego;

let enemigos;
let balas;
let proyectilesEnemigos;

let tiempoLimite = 900;

let textoUI;
let textoMatematicas;
let contenedorMatematicas;
let fondoMat;

let juegoCongelado = false;
let jugadorMuerto = false;


// ==================================================
// SISTEMA DE RONDAS
// ==================================================

let rondaActual = 1;
let generandoNuevaRonda = false;

let textoRonda;


// ==================================================
// VIDA DEL JUGADOR
// ==================================================

let vidaJugador = 100;
const vidaMaxima = 100;

let invulnerable = false;
const tiempoInvulnerabilidad = 500;


// ==================================================
// ARMAS
// ==================================================

const ARMAS = {

    PISTOLA: {
        nombre: 'Pistola',
        balasMax: 6,
        dañoGlifo: 20,
        dañoVortice: 20,
        dañoGolem: 10,
        velocidadBala: 450,
        dif: 'Fácil'
    },

    RIFLE: {
        nombre: 'Rifle',
        balasMax: 15,
        dañoGlifo: 10,
        dañoVortice: 10,
        dañoGolem: 10,
        velocidadBala: 650,
        dif: 'Medio'
    },

    ESCOPETA: {
        nombre: 'Escopeta',
        balasMax: 2,
        dañoGlifo: 76,
        dañoVortice: 76,
        dañoGolem: 76,
        velocidadBala: 350,
        dif: 'Difícil'
    }
};

let armaActual = ARMAS.PISTOLA;
let balasActuales = armaActual.balasMax;


// ==================================================
// BANCO DE PREGUNTAS
// ==================================================

const BANCO_PREGUNTAS = {

    'Fácil': [

        {
            f: 'y = (3x - 1)⁵',

            p1: {
                q: 'Deriva la potencia externa:',

                opciones: [
                    'Z) 5(3x-1)⁴',
                    'X) 5(3x-1)⁵',
                    'C) (3x-1)⁴'
                ],

                correcta: 0
            },

            p2: {
                q: 'Deriva lo interno (3x-1):',

                opciones: [
                    'Z) 3x',
                    'X) 3',
                    'C) 1'
                ],

                correcta: 1
            }
        }
    ],


    'Medio': [

        {
            f: 'y = cos(x³)',

            p1: {
                q: 'Deriva la trigonométrica externa:',

                opciones: [
                    'Z) sin(x³)',
                    'X) -sin(x³)',
                    'C) -cos(x³)'
                ],

                correcta: 1
            },

            p2: {
                q: 'Deriva lo interno (x³):',

                opciones: [
                    'Z) 3x²',
                    'X) 3x',
                    'C) x²'
                ],

                correcta: 0
            }
        }
    ],


    'Difícil': [

        {
            f: 'y = ln(sin(x))',

            p1: {
                q: 'Deriva el logaritmo externo:',

                opciones: [
                    'Z) 1/x',
                    'X) 1/sin(x)',
                    'C) cos(x)'
                ],

                correcta: 1
            },

            p2: {
                q: 'Deriva lo interno (sin(x)):',

                opciones: [
                    'Z) cos(x)',
                    'X) -cos(x)',
                    'C) 1/cos(x)'
                ],

                correcta: 0
            }
        }
    ]
};

let preguntaActual = null;
let pasoActual = 1;


// ==================================================
// PRELOAD
// ==================================================

function preload() {

}


// ==================================================
// CREATE
// ==================================================

function create() {

    escenaJuego = this;

    this.physics.world.setBounds(
        0,
        0,
        2400,
        2400
    );


    // ==================================================
    // REJILLA
    // ==================================================

    let graphics = this.add.graphics();

    graphics.lineStyle(
        1,
        0x333344,
        1
    );

    for (
        let x = 0;
        x < 2400;
        x += 80
    ) {

        graphics.moveTo(x, 0);
        graphics.lineTo(x, 2400);
    }

    for (
        let y = 0;
        y < 2400;
        y += 80
    ) {

        graphics.moveTo(0, y);
        graphics.lineTo(2400, y);
    }

    graphics.strokePath();


    // ==================================================
    // JUGADOR
    // ==================================================

    jugador = this.add.rectangle(
        1200,
        1200,
        32,
        32,
        0x00ff00
    );

    this.physics.add.existing(jugador);

    jugador.body.setCollideWorldBounds(true);


    // ==================================================
    // CÁMARA
    // ==================================================

    this.cameras.main.setBounds(
        0,
        0,
        2400,
        2400
    );

    this.cameras.main.startFollow(
        jugador
    );


    // ==================================================
    // GRUPOS
    // ==================================================

    enemigos = this.physics.add.group();

    balas = this.physics.add.group();

    proyectilesEnemigos =
        this.physics.add.group();


    // ==================================================
    // CONTROLES
    // ==================================================

    teclado = this.input.keyboard.addKeys({

        ARRIBA: Phaser.Input.Keyboard.KeyCodes.W,
        ABAJO: Phaser.Input.Keyboard.KeyCodes.S,
        IZQUIERDA: Phaser.Input.Keyboard.KeyCodes.A,
        DERECHA: Phaser.Input.Keyboard.KeyCodes.D,

        UNO: Phaser.Input.Keyboard.KeyCodes.ONE,
        DOS: Phaser.Input.Keyboard.KeyCodes.TWO,
        TRES: Phaser.Input.Keyboard.KeyCodes.THREE,

        Z: Phaser.Input.Keyboard.KeyCodes.Z,
        X: Phaser.Input.Keyboard.KeyCodes.X,
        C: Phaser.Input.Keyboard.KeyCodes.C
    });

    mouse = this.input.activePointer;


    // ==================================================
    // PRIMERA RONDA
    // ==================================================

    iniciarRonda(this);


    // ==================================================
    // COLISIONES
    // ==================================================

    this.physics.add.overlap(
        balas,
        enemigos,
        impactarEnemigo,
        null,
        this
    );

    this.physics.add.overlap(
        jugador,
        enemigos,
        contactoEnemigo,
        null,
        this
    );

    this.physics.add.overlap(
        jugador,
        proyectilesEnemigos,
        impactoProyectilEnemigo,
        null,
        this
    );


    // ==================================================
    // UI
    // ==================================================

    textoUI = this.add.text(
        20,
        20,
        '',
        {
            fontSize: '18px',
            fill: '#ffffff',
            fontStyle: 'bold'
        }
    ).setScrollFactor(0);


    textoRonda = this.add.text(
        780,
        20,
        '',
        {
            fontSize: '22px',
            fill: '#ffff00',
            fontStyle: 'bold'
        }
    )
    .setOrigin(1, 0)
    .setScrollFactor(0);


    actualizarUI();


    // ==================================================
    // MÓDULO MATEMÁTICO
    // ==================================================

    contenedorMatematicas =
        this.add.container(
            400,
            480
        ).setScrollFactor(0);

    fondoMat = this.add.rectangle(
        0,
        0,
        720,
        200,
        0x0b0b14,
        0.95
    );

    fondoMat.setStrokeStyle(
        3,
        0xffaa00
    );

    textoMatematicas = this.add.text(
        -340,
        -80,
        '',
        {
            fontSize: '15px',
            fill: '#ffffff',
            fontStyle: 'bold',
            lineSpacing: 8,
            wordWrap: {
                width: 680
            }
        }
    );

    contenedorMatematicas.add([
        fondoMat,
        textoMatematicas
    ]);

    contenedorMatematicas.setVisible(false);


    // ==================================================
    // TEMPORIZADOR
    // ==================================================

    this.time.addEvent({

        delay: 1000,

        callback: () => {

            if (tiempoLimite > 0) {

                tiempoLimite--;

            }

            actualizarUI();

        },

        loop: true
    });


    // ==================================================
    // DISPARO
    // ==================================================

    this.input.on(
        'pointerdown',
        () => {

            disparar(this);

        }
    );
}


// ==================================================
// UPDATE
// ==================================================

function update() {

    if (jugadorMuerto) {

        jugador.body.setVelocity(0);

        return;
    }


    if (juegoCongelado) {

        manejarRecarga();

        jugador.body.setVelocity(0);

        enemigos.getChildren().forEach(
            enemigo => {

                enemigo.body.setVelocity(0);

            }
        );

        proyectilesEnemigos.getChildren().forEach(
            proyectil => {

                proyectil.body.setVelocity(0);

            }
        );

        return;
    }


    // ==================================================
    // CAMBIO DE ARMAS
    // ==================================================

    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.UNO
        )
    ) {

        cambiarArma(
            ARMAS.PISTOLA
        );
    }

    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.DOS
        )
    ) {

        cambiarArma(
            ARMAS.RIFLE
        );
    }

    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.TRES
        )
    ) {

        cambiarArma(
            ARMAS.ESCOPETA
        );
    }


    // ==================================================
    // MOVIMIENTO WASD
    // ==================================================

    jugador.body.setVelocity(0);

    let velocidad = 300;


    if (teclado.IZQUIERDA.isDown) {

        jugador.body.setVelocityX(-velocidad);

    } else if (teclado.DERECHA.isDown) {

        jugador.body.setVelocityX(velocidad);

    }


    if (teclado.ARRIBA.isDown) {

        jugador.body.setVelocityY(-velocidad);

    } else if (teclado.ABAJO.isDown) {

        jugador.body.setVelocityY(velocidad);

    }


    // ==================================================
    // MOVIMIENTO ENEMIGOS
    // ==================================================

    enemigos.getChildren().forEach(
        enemigo => {

            if (
                enemigo.tipo === 'Glifo'
            ) {

                this.physics.moveToObject(
                    enemigo,
                    jugador,
                    160
                );

            } else if (
                enemigo.tipo === 'Golem'
            ) {

                this.physics.moveToObject(
                    enemigo,
                    jugador,
                    50
                );

            } else if (
                enemigo.tipo === 'Vortice'
            ) {

                let distancia =
                    Phaser.Math.Distance.Between(
                        enemigo.x,
                        enemigo.y,
                        jugador.x,
                        jugador.y
                    );


                if (distancia > 350) {

                    this.physics.moveToObject(
                        enemigo,
                        jugador,
                        80
                    );

                } else {

                    enemigo.body.setVelocity(0);

                }


                // ==========================================
                // ATAQUE DEL VÓRTICE
                // ==========================================

                if (
                    !enemigo.ultimoDisparo ||
                    this.time.now - enemigo.ultimoDisparo >= 2000
                ) {

                    dispararProyectilVortice(
                        this,
                        enemigo
                    );

                    enemigo.ultimoDisparo =
                        this.time.now;
                }
            }
        }
    );
}


// ==================================================
// SISTEMA DE RONDAS
// ==================================================

function iniciarRonda(escena) {

    generandoNuevaRonda = true;


    // ==========================================
    // CONFIGURACIÓN DE LA RONDA
    // ==========================================

    let cantidadGlifos = 0;
    let cantidadVortices = 0;
    let cantidadGolems = 0;


    // RONDA 1
    if (rondaActual === 1) {

        cantidadGlifos = 5;
    }


    // RONDA 2
    else if (rondaActual === 2) {

        cantidadVortices = 4;
    }


    // RONDA 3
    else if (rondaActual === 3) {

        cantidadGlifos = 6;
        cantidadVortices = 4;
    }


    // RONDA 4
    else if (rondaActual === 4) {

        cantidadGolems = 3;
    }


    // RONDA 5 EN ADELANTE
    else {

        let aumento =
            rondaActual - 5;


        cantidadGlifos =
            6 + (aumento * 2);

        cantidadVortices =
            4 + aumento;

        cantidadGolems =
            2 + Math.floor(
                aumento / 2
            );
    }


    // ==========================================
    // CREAR GLIFOS
    // ==========================================

    for (
        let i = 0;
        i < cantidadGlifos;
        i++
    ) {

        crearEnemigo(
            escena,
            'Glifo',
            0x00ffff,
            20
        );
    }


    // ==========================================
    // CREAR VÓRTICES
    // ==========================================

    for (
        let i = 0;
        i < cantidadVortices;
        i++
    ) {

        crearEnemigo(
            escena,
            'Vortice',
            0xff00ff,
            20
        );
    }


    // ==========================================
    // CREAR GOLEMS
    // ==========================================

    for (
        let i = 0;
        i < cantidadGolems;
        i++
    ) {

        crearEnemigo(
            escena,
            'Golem',
            0xff5500,
            150
        );
    }


    generandoNuevaRonda = false;

    mostrarRonda();

    actualizarUI();
}


// ==================================================
// MOSTRAR RONDA
// ==================================================

function mostrarRonda() {

    if (!textoRonda) {
        return;
    }


    textoRonda.setText(
        `RONDA ${rondaActual}`
    );


    textoRonda.setAlpha(1);


    escenaJuego.tweens.add({

        targets: textoRonda,

        alpha: 0.35,

        duration: 700,

        yoyo: true,

        repeat: 2
    });
}


// ==================================================
// COMPROBAR FIN DE RONDA
// ==================================================

function comprobarFinRonda() {

    if (
        jugadorMuerto ||
        generandoNuevaRonda
    ) {

        return;
    }


    let enemigosVivos =
        enemigos.countActive(true);


    if (
        enemigosVivos <= 0
    ) {

        generandoNuevaRonda = true;


        // Pequeña pausa entre rondas
        escenaJuego.time.delayedCall(
            1000,
            () => {

                if (jugadorMuerto) {
                    return;
                }


                rondaActual++;


                iniciarRonda(
                    escenaJuego
                );
            }
        );
    }
}


// ==================================================
// CREAR ENEMIGO
// ==================================================

function crearEnemigo(
    escena,
    tipo,
    color,
    hp
) {

    let x;
    let y;
    let distanciaJugador;


    // ==========================================
    // BUSCAR UNA POSICIÓN LEJANA DEL JUGADOR
    // ==========================================

    do {

        x =
            Phaser.Math.Between(
                100,
                2300
            );

        y =
            Phaser.Math.Between(
                100,
                2300
            );


        distanciaJugador =
            Phaser.Math.Distance.Between(
                x,
                y,
                jugador.x,
                jugador.y
            );

    } while (
        distanciaJugador < 400
    );


    let tamaño =
        tipo === 'Golem'
            ? 48
            : 24;


    let enemigo =
        escena.add.rectangle(
            x,
            y,
            tamaño,
            tamaño,
            color
        );


    escena.physics.add.existing(
        enemigo
    );


    enemigo.tipo = tipo;
    enemigo.hp = hp;
    enemigo.ultimoDisparo = 0;


    enemigos.add(enemigo);
}


// ==================================================
// DISPARAR
// ==================================================

function disparar(escena) {

    if (
        juegoCongelado ||
        jugadorMuerto
    ) {

        return;
    }


    if (balasActuales <= 0) {

        iniciarRecarga();

        return;
    }


    balasActuales--;

    actualizarUI();


    let bala =
        escena.add.circle(
            jugador.x,
            jugador.y,
            6,
            0xffff00
        );


    escena.physics.add.existing(
        bala
    );


    balas.add(bala);


    let angulo =
        Phaser.Math.Angle.Between(
            jugador.x,
            jugador.y,
            escena.cameras.main.scrollX +
                mouse.x,
            escena.cameras.main.scrollY +
                mouse.y
        );


    escena.physics.velocityFromRotation(
        angulo,
        armaActual.velocidadBala,
        bala.body.velocity
    );
}


// ==================================================
// DISPARO DEL VÓRTICE
// ==================================================

function dispararProyectilVortice(
    escena,
    vortice
) {

    if (
        juegoCongelado ||
        jugadorMuerto
    ) {

        return;
    }


    let proyectil =
        escena.add.circle(
            vortice.x,
            vortice.y,
            7,
            0xff00ff
        );


    escena.physics.add.existing(
        proyectil
    );


    proyectilesEnemigos.add(
        proyectil
    );


    let angulo =
        Phaser.Math.Angle.Between(
            vortice.x,
            vortice.y,
            jugador.x,
            jugador.y
        );


    escena.physics.velocityFromRotation(
        angulo,
        220,
        proyectil.body.velocity
    );


    proyectil.daño = 10;


    escena.time.delayedCall(
        5000,
        () => {

            if (
                proyectil &&
                proyectil.active
            ) {

                proyectil.destroy();

            }
        }
    );
}


// ==================================================
// CONTACTO CON ENEMIGOS
// ==================================================

function contactoEnemigo(
    jugadorObj,
    enemigo
) {

    if (
        jugadorMuerto ||
        invulnerable
    ) {

        return;
    }


    // Vórtice NO hace daño por contacto.
    if (
        enemigo.tipo === 'Vortice'
    ) {

        return;
    }


    if (
        enemigo.tipo === 'Glifo'
    ) {

        recibirDaño(10);

    }


    if (
        enemigo.tipo === 'Golem'
    ) {

        recibirDaño(20);

    }
}


// ==================================================
// IMPACTO DEL PROYECTIL
// ==================================================

function impactoProyectilEnemigo(
    jugadorObj,
    proyectil
) {

    if (
        jugadorMuerto
    ) {

        return;
    }


    // El proyectil desaparece aunque
    // el jugador esté temporalmente invulnerable.
    proyectil.destroy();


    if (
        invulnerable
    ) {

        return;
    }


    recibirDaño(10);
}


// ==================================================
// RECIBIR DAÑO
// ==================================================

function recibirDaño(
    cantidad
) {

    if (
        jugadorMuerto ||
        invulnerable
    ) {

        return;
    }


    vidaJugador -= cantidad;


    if (
        vidaJugador < 0
    ) {

        vidaJugador = 0;
    }


    actualizarUI();


    // ==========================================
    // INVULNERABILIDAD TEMPORAL
    // ==========================================

    invulnerable = true;

    jugador.setAlpha(0.4);


    escenaJuego.time.delayedCall(
        tiempoInvulnerabilidad,
        () => {

            if (
                !jugadorMuerto
            ) {

                invulnerable = false;

                jugador.setAlpha(1);

            }
        }
    );


    // ==========================================
    // MUERTE
    // ==========================================

    if (
        vidaJugador <= 0
    ) {

        morirJugador();
    }
}


// ==================================================
// MUERTE DEL JUGADOR
// ==================================================

function morirJugador() {

    jugadorMuerto = true;

    jugador.body.setVelocity(0);


    enemigos.getChildren().forEach(
        enemigo => {

            enemigo.body.setVelocity(0);

        }
    );


    proyectilesEnemigos.getChildren().forEach(
        proyectil => {

            proyectil.body.setVelocity(0);

        }
    );


    // ==========================================
    // PANTALLA DE MUERTE
    // ==========================================

    let fondoMuerte =
        escenaJuego.add.rectangle(
            400,
            300,
            800,
            600,
            0x000000,
            0.75
        ).setScrollFactor(0);


    let textoMuerte =
        escenaJuego.add.text(
            400,
            300,
            'HAS MUERTO',
            {
                fontSize: '48px',
                fill: '#ff0000',
                fontStyle: 'bold'
            }
        )
        .setOrigin(0.5)
        .setScrollFactor(0);


    escenaJuego.add.text(
        400,
        360,
        `Llegaste a la ronda ${rondaActual}`,
        {
            fontSize: '18px',
            fill: '#ffffff'
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);


    escenaJuego.add.text(
        400,
        395,
        'Recarga la página para volver a jugar',
        {
            fontSize: '18px',
            fill: '#ffffff'
        }
    )
    .setOrigin(0.5)
    .setScrollFactor(0);
}


// ==================================================
// IMPACTO ENEMIGO
// ==================================================

function impactarEnemigo(
    bala,
    enemigo
) {

    bala.destroy();


    let daño = 0;


    if (
        enemigo.tipo === 'Glifo'
    ) {

        daño = armaActual.dañoGlifo;

    }


    if (
        enemigo.tipo === 'Vortice'
    ) {

        daño = armaActual.dañoVortice;

    }


    if (
        enemigo.tipo === 'Golem'
    ) {

        daño = armaActual.dañoGolem;

    }


    enemigo.hp -= daño;


    if (
        enemigo.hp <= 0
    ) {

        enemigo.destroy();


        // Comprobar si este era el último
        // enemigo de la ronda.
        comprobarFinRonda();
    }
}


// ==================================================
// CAMBIAR ARMA
// ==================================================

function cambiarArma(
    nuevaArma
) {

    armaActual = nuevaArma;

    balasActuales =
        armaActual.balasMax;

    actualizarUI();
}


// ==================================================
// ACTUALIZAR UI
// ==================================================

function actualizarUI() {

    if (!textoUI) {
        return;
    }


    let minutos =
        Math.floor(
            tiempoLimite / 60
        );


    let segundos =
        tiempoLimite % 60;


    segundos =
        segundos < 10
            ? '0' + segundos
            : segundos;


    let enemigosRestantes =
        enemigos
            ? enemigos.countActive(true)
            : 0;


    textoUI.setText(

        `❤️ VIDA: ${vidaJugador} / ${vidaMaxima}\n` +

        `⏱️ TIEMPO RESTANTE: ${minutos}:${segundos}\n` +

        `💥 ARMA EQUIPADA: ${armaActual.nombre.toUpperCase()} (Dificultad: ${armaActual.dif})\n` +

        `⚡ MUNICIÓN: ${balasActuales} / ${armaActual.balasMax}\n` +

        `👾 ENEMIGOS RESTANTES: ${enemigosRestantes}\n\n` +

        `[Movimiento]: W A S D\n` +

        `[Disparo]: Click izquierdo\n` +

        `[Armas]: 1 Pistola | 2 Rifle | 3 Escopeta`

    );


    if (textoRonda) {

        textoRonda.setText(
            `RONDA ${rondaActual}`
        );
    }
}


// ==================================================
// INICIAR RECARGA
// ==================================================

function iniciarRecarga() {

    juegoCongelado = true;

    pasoActual = 1;


    let lista =
        BANCO_PREGUNTAS[
            armaActual.dif
        ];


    preguntaActual =
        lista[
            Phaser.Math.Between(
                0,
                lista.length - 1
            )
        ];


    contenedorMatematicas.setVisible(
        true
    );


    mostrarPaso();
}


// ==================================================
// MOSTRAR PREGUNTA
// ==================================================

function mostrarPaso() {

    let paso =
        pasoActual === 1
            ? preguntaActual.p1
            : preguntaActual.p2;


    textoMatematicas.setText(

        `⚠️ MÓDULO DE DERIVACIÓN REQUERIDO (REGLA DE LA CADENA)\n\n` +

        `Función actual: ${preguntaActual.f}\n\n` +

        `PASO ${pasoActual}: ${paso.q}\n\n` +

        `Presiona la tecla correspondiente:\n\n` +

        `👉 ${paso.opciones[0]}    👉 ${paso.opciones[1]}    👉 ${paso.opciones[2]}\n\n` +

        `Z = primera opción     X = segunda opción     C = tercera opción`

    );
}


// ==================================================
// MANEJAR RECARGA
// ==================================================

function manejarRecarga() {

    let paso =
        pasoActual === 1
            ? preguntaActual.p1
            : preguntaActual.p2;


    let seleccion = -1;


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.Z
        )
    ) {

        seleccion = 0;

    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.X
        )
    ) {

        seleccion = 1;

    }


    if (
        Phaser.Input.Keyboard.JustDown(
            teclado.C
        )
    ) {

        seleccion = 2;

    }


    if (
        seleccion !== -1
    ) {

        if (
            seleccion === paso.correcta
        ) {

            if (
                pasoActual === 1
            ) {

                pasoActual = 2;

                mostrarPaso();

            } else {

                balasActuales =
                    armaActual.balasMax;

                juegoCongelado = false;

                contenedorMatematicas.setVisible(
                    false
                );

                actualizarUI();
            }

        } else {

            fondoMat.setStrokeStyle(
                3,
                0xff0000
            );


            escenaJuego.time.delayedCall(
                300,
                () => {

                    fondoMat.setStrokeStyle(
                        3,
                        0xffaa00
                    );

                }
            );
        }
    }
}

</script>
